<script src="config.js" onerror="window.APP_CONFIG=window.APP_CONFIG||{}"></script>
<style>
/* =====================================================================
   1. TOKENS — derivados do Branding Book (uso apenas estético)
   Viva #9CAA39 · Argamassa #E3D9AC · Urbano #3E162F
   Aço #283145 · Tijolo #E9B349 · Solo #9D491F
   ===================================================================== */
:root{
  --viva:#9CAA39; --viva-deep:#6E7A1F; --viva-soft:#E6EBC6;
  --argamassa:#E3D9AC; --argamassa-soft:#EFE9CF;
  --urbano:#3E162F; --urbano-soft:#EADCE3;
  --aco:#283145; --aco-2:#353F57;
  --tijolo:#E9B349; --tijolo-soft:#F8E6BC;
  --solo:#9D491F; --solo-soft:#F1DCCF;
  --paper:#F4F0E6; --paper-2:#FBF9F3; --card:#FFFDF8;
  --ink:#1F2433; --ink-2:#4A4E5C; --muted:#7A7C85; --line:#DDD6C3; --line-2:#E9E3D3;
  --r-xl:36px; --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(31,36,51,.05),0 10px 30px -12px rgba(31,36,51,.18);
  --shadow-lg:0 30px 60px -25px rgba(31,36,51,.35);
  --f-display:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gutter:clamp(16px,4vw,40px);
  --header-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
img,svg{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.08}
p{margin:0}
:focus-visible{outline:3px solid var(--tijolo);outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;align-items:center;gap:.6em}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px;opacity:.6}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 var(--gutter)}

/* =====================================================================
   2. HEADER + PROGRESSO DA JORNADA
   ===================================================================== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(244,240,230,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-color:var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:var(--header-h)}
.brandmark{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:600;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
.brandmark .glyph{width:30px;height:30px;flex:none}
.brandmark span b{color:var(--solo);font-weight:600}
.phases{flex:1;display:flex;justify-content:center;gap:6px;min-width:0;overflow:hidden}
.phase{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;font-size:.8rem;color:var(--muted);white-space:nowrap;transition:all .4s var(--ease)}
.phase i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:.66rem;flex:none;background:var(--paper-2);transition:all .4s var(--ease)}
.phase.done{color:var(--ink-2)}
.phase.done i{background:var(--viva);border-color:var(--viva);color:#fff}
.phase.current{background:var(--aco);color:var(--argamassa)}
.phase.current i{background:var(--tijolo);border-color:var(--tijolo);color:var(--aco)}
.top-actions{display:flex;align-items:center;gap:8px}
.stamps{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);font-family:var(--f-mono);font-size:.72rem;white-space:nowrap}
.stamps .dots{display:flex;gap:3px}
.stamps .dots b{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .5s}
.stamps .dots b.on{background:var(--solo)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);display:grid;place-items:center;transition:background .2s,transform .2s}
.icon-btn:hover{background:var(--card);transform:rotate(-30deg)}
.icon-btn svg{width:18px;height:18px}
.demo-flag{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;background:var(--tijolo-soft);color:#7a5408;border:1px solid #edd08a;padding:4px 9px;border-radius:999px;white-space:nowrap}
.progress-line{height:3px;background:transparent;position:relative}
.progress-line span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--viva),var(--tijolo),var(--solo));border-radius:0 3px 3px 0;transition:width .8s var(--ease)}
@media (max-width:1320px){.phase:not(.current) span{display:none}.phase:not(.current){padding:4px}}
@media (max-width:980px){.phase span{display:none}.phase{padding:4px}.phase.current{padding:4px 12px 4px 4px}.phase.current span{display:inline}}
@media (max-width:640px){
  :root{--header-h:58px}
  .phase i{width:20px;height:20px}
  .top-actions{gap:6px}
  .stamps{padding:6px 8px}
  .brandmark span{display:none}
  .phases{justify-content:flex-start;gap:3px}
  .phase.current span{font-size:.74rem;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
  .stamps .label{display:none}
  .demo-flag{display:none}
}

/* =====================================================================
   3. PALCO E TRANSIÇÕES
   ===================================================================== */
main#stage{flex:1;position:relative}
.screen{padding:clamp(24px,5vw,56px) 0 120px;animation:enter .7s var(--ease) both}
.screen.leaving{animation:leave .25s ease both}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-10px)}}
.stagger>*{animation:enter .7s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.14s}.stagger>*:nth-child(4){animation-delay:.21s}.stagger>*:nth-child(5){animation-delay:.28s}.stagger>*:nth-child(6){animation-delay:.35s}.stagger>*:nth-child(7){animation-delay:.42s}.stagger>*:nth-child(8){animation-delay:.49s}.stagger>*:nth-child(n+9){animation-delay:.55s}
.screen-head{max-width:720px;margin-bottom:clamp(22px,4vw,40px)}
.screen-head h2{font-size:clamp(2rem,5.2vw,3.5rem);font-weight:600;margin:.35em 0 .3em}
.screen-head p{font-size:clamp(1.02rem,1.6vw,1.18rem);color:var(--ink-2);max-width:620px}
.h-accent{color:var(--solo)}

/* =====================================================================
   4. BOTÕES E BARRA DE AÇÕES
   ===================================================================== */
.btn{--bg:var(--aco);--fg:var(--argamassa);display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 10px 0 26px;border-radius:999px;border:0;background:var(--bg);color:var(--fg);font-weight:500;font-size:1rem;letter-spacing:-.005em;transition:transform .25s var(--ease),box-shadow .25s,background .25s,opacity .25s;text-decoration:none;white-space:nowrap}
.btn .arrow{width:38px;height:38px;border-radius:50%;background:var(--tijolo);color:var(--aco);display:grid;place-items:center;transition:transform .3s var(--ease)}
.btn .arrow svg{width:18px;height:18px}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(40,49,69,.7)}
.btn:hover .arrow{transform:translateX(3px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.solo{--bg:var(--solo);--fg:#fff}
.btn.solo .arrow{background:var(--argamassa)}
.btn.light{--bg:var(--argamassa);--fg:var(--aco)}
.btn.light .arrow{background:var(--aco);color:var(--argamassa)}
.btn.plain{padding:0 24px}
.btn-ghost{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:500;transition:all .2s;text-decoration:none}
.btn-ghost:hover{border-color:var(--ink);background:var(--card)}
.btn-ghost svg{width:18px;height:18px}
.btn-back{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper-2);display:grid;place-items:center;flex:none;transition:all .2s}
.btn-back:hover{border-color:var(--ink)}
.btn-back svg{width:20px;height:20px}
.actions{display:flex;align-items:center;gap:12px;margin-top:36px}
.actions .hint{font-size:.86rem;color:var(--muted);margin-right:auto}
.actions .grow{flex:1}
@media (max-width:640px){
  .actions.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,rgba(244,240,230,0));}
  .actions.dock .btn{flex:1}
  .actions.dock .hint{display:none}
}

/* =====================================================================
   5. HERO (ETAPA 01)
   ===================================================================== */
.hero{padding-top:clamp(18px,4vw,40px)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(3rem,8.6vw,6.6rem);font-weight:700;letter-spacing:-.045em;line-height:.92;margin:18px 0 22px}
.hero h1 .q{color:var(--solo)}
.hero h1 .ul{position:relative;white-space:nowrap}
.hero h1 .ul svg{position:absolute;left:-2%;bottom:-.12em;width:104%;height:.32em;overflow:visible}
.hero .byline{display:inline-flex;align-items:center;gap:10px;margin:-6px 0 22px;font-family:var(--f-mono);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hero .byline::before{content:"";width:28px;height:2px;border-radius:2px;background:var(--solo)}
.hero .byline b{font-weight:500;color:var(--solo)}
.hero .sub{font-size:clamp(1.2rem,2.2vw,1.55rem);font-weight:500;letter-spacing:-.015em;margin-bottom:12px}
.hero .support{color:var(--ink-2);max-width:500px;font-size:1.05rem;margin-bottom:30px}
.hero-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:26px;color:var(--muted);font-size:.86rem}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.hero-meta svg{width:16px;height:16px}
.hero-visual{position:relative;aspect-ratio:4/4.6;max-height:640px}
.arch-frame{position:absolute;inset:0;border-radius:999px 999px var(--r-xl) var(--r-xl);overflow:hidden;background:var(--argamassa);box-shadow:var(--shadow-lg)}
.arch-frame>svg,.arch-frame>img{width:100%;height:100%;object-fit:cover}
.float-card{position:absolute;background:var(--card);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:.86rem;animation:floaty 6s ease-in-out infinite}
.float-card .mono{color:var(--muted);font-size:.62rem;display:block}
.float-card b{font-weight:600}
.float-card.a{left:-6%;top:22%}
.float-card.b{right:-4%;bottom:16%;animation-delay:-3s}
.float-card .mini-gauge{width:42px;height:42px}
.float-card .swatches{display:flex}
.float-card .swatches i{width:16px;height:16px;border-radius:50%;border:2px solid var(--card);margin-left:-5px}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.three{margin-top:clamp(48px,8vw,96px);background:var(--solo);color:#fff;border-radius:var(--r-xl);padding:clamp(28px,5vw,52px);position:relative;overflow:hidden}
.three .arcs{position:absolute;inset:0;pointer-events:none;opacity:.35}
.three-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.three-item{padding:8px 6px}
.three-item .num{font-family:var(--f-mono);font-size:.72rem;opacity:.8;letter-spacing:.1em}
.three-item h3{font-size:clamp(1.3rem,2.4vw,1.8rem);font-weight:500;margin:10px 0 8px}
.three-item p{opacity:.86;font-size:.95rem}
.three-quote{position:relative;font-size:clamp(1.15rem,2.2vw,1.5rem);font-weight:400;letter-spacing:-.01em;max-width:760px;margin-bottom:34px}
.three-quote em{font-style:normal;color:var(--tijolo)}
.pattern-band{height:84px;margin-top:20px;border-radius:var(--r-lg);overflow:hidden}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .hero-visual{order:-1;max-width:420px;width:86%;margin:0 auto;aspect-ratio:4/4.3}
  .float-card.a{left:-10%}
  .float-card.b{right:-8%}
  .three-grid{grid-template-columns:1fr}
}

/* =====================================================================
   6. CARDS DE OPÇÃO / AMBIENTES
   ===================================================================== */
.env-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,22px)}
.env-card{position:relative;text-align:left;border:0;padding:0;background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s;outline:2px solid transparent;outline-offset:0}
.env-card .art{aspect-ratio:4/3.1;background:var(--argamassa);overflow:hidden;border-radius:999px 999px 0 0;margin:12px 12px 0;transition:border-radius .5s var(--ease)}
.env-card .art>svg,.env-card .art>img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.env-card .body{padding:18px 20px 22px}
.env-card h3{font-size:1.45rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.env-card p{color:var(--ink-2);font-size:.95rem}
.env-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.env-card:hover .art svg,.env-card:hover .art img{transform:scale(1.04)}
.env-card[aria-pressed="true"]{outline:2.5px solid var(--aco);background:var(--aco);color:var(--argamassa)}
.env-card[aria-pressed="true"] p{color:rgba(227,217,172,.82)}
.env-card[aria-pressed="true"] .art{border-radius:var(--r-md) var(--r-md) 0 0}
.check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .3s var(--ease)}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .3s var(--ease)}
[aria-pressed="true"] .check{background:var(--tijolo);border-color:var(--tijolo);color:var(--aco)}
[aria-pressed="true"] .check svg{opacity:1;transform:none}
@media (max-width:760px){
  .env-grid{grid-template-columns:1fr}
  .env-card{display:grid;grid-template-columns:120px 1fr;align-items:center}
  .env-card .art{margin:10px;aspect-ratio:1;border-radius:999px 999px var(--r-sm) var(--r-sm)}
  .env-card .body{padding:12px 16px 12px 4px}
  .env-card h3{font-size:1.2rem}
  .env-card p{font-size:.88rem}
}

/* =====================================================================
   7. UPLOAD (ETAPA 03)
   ===================================================================== */
.upload-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(18px,3vw,32px);align-items:start}
.dropzone{position:relative;border:2px dashed #CFC6AE;border-radius:var(--r-xl);background:var(--paper-2);min-height:400px;display:grid;place-items:center;text-align:center;padding:32px;transition:all .3s var(--ease);overflow:hidden}
.dropzone.drag{border-color:var(--viva);background:var(--viva-soft);transform:scale(1.01)}
.dropzone .dz-inner{max-width:360px;display:grid;justify-items:center;gap:14px}
.dz-icon{width:86px;height:86px;border-radius:999px 999px 22px 22px;background:var(--argamassa);display:grid;place-items:center;color:var(--aco)}
.dz-icon svg{width:36px;height:36px}
.dropzone h3{font-size:1.35rem;font-weight:600}
.dropzone p{color:var(--ink-2);font-size:.95rem}
.dz-buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.dz-formats{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;color:var(--muted)}
.preview{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--aco);box-shadow:var(--shadow-lg);animation:enter .6s var(--ease)}
.preview img{width:100%;max-height:560px;object-fit:contain;background:#1b2030}
.preview .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:var(--aco);color:var(--argamassa)}
.preview .bar .meta{font-family:var(--f-mono);font-size:.7rem;opacity:.8;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.chip-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(227,217,172,.35);background:transparent;color:inherit;font-size:.88rem}
.chip-btn:hover{background:rgba(227,217,172,.12)}
.chip-btn svg{width:16px;height:16px}
.side-notes{display:grid;gap:14px}
.note{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);font-size:.93rem;color:var(--ink-2)}
.note h4{font-size:1rem;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.note h4 svg{width:20px;height:20px;color:var(--solo)}
.note.tip{background:var(--viva-soft)}
.note.tip h4 svg{color:var(--viva-deep)}
.note.privacy{background:var(--argamassa-soft)}
.consent-row{display:flex;gap:12px;align-items:flex-start;margin-top:12px;font-size:.9rem;color:var(--ink)}
.consent-row input{width:22px;height:22px;accent-color:var(--aco);flex:none;margin-top:1px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--solo-soft);color:#6b2e10;font-size:.92rem;margin-top:14px;animation:shake .4s}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@media (max-width:860px){.upload-grid{grid-template-columns:1fr}.dropzone{min-height:320px}}

/* =====================================================================
   8. PROCESSAMENTO (ETAPAS 04 e 08)
   ===================================================================== */
.scan-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:center;min-height:60vh}
.scan{position:relative;aspect-ratio:4/4.6;max-width:460px;width:100%;margin:0 auto}
.scan .arch-frame{background:#151a26}
.scan .arch-frame img{opacity:.92;filter:saturate(.9)}
.scan .beam{position:absolute;left:0;right:0;height:34%;top:-34%;background:linear-gradient(to bottom,rgba(233,179,73,0),rgba(233,179,73,.28) 80%,rgba(233,179,73,.9));mix-blend-mode:screen;animation:beam 2.6s cubic-bezier(.6,0,.4,1) infinite}
.scan .grid-ov{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:12.5% 10%}
@keyframes beam{0%{top:-34%}100%{top:100%}}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;opacity:0;animation:pinIn .6s var(--ease) forwards}
.pin i{width:16px;height:16px;border-radius:50%;background:var(--tijolo);box-shadow:0 0 0 5px rgba(233,179,73,.3);animation:pulse 1.8s infinite}
.pin span{background:rgba(31,36,51,.82);color:var(--argamassa);font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
@keyframes pinIn{from{opacity:0;transform:translate(-50%,-30%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(233,179,73,.35)}50%{box-shadow:0 0 0 10px rgba(233,179,73,0)}}
.orbit{position:absolute;inset:-7%;pointer-events:none}
.orbit circle{fill:none;stroke:var(--solo);stroke-width:1.2;stroke-dasharray:2 8;transform-origin:center;animation:spin 30s linear infinite}
.orbit circle:nth-child(2){stroke:var(--viva);animation-duration:44s;animation-direction:reverse;stroke-dasharray:30 14}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-text h2{font-size:clamp(1.8rem,4vw,2.8rem);margin:14px 0 22px}
.proc-steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.proc-steps li{display:flex;align-items:center;gap:14px;color:var(--muted);transition:color .4s;font-size:1.02rem}
.proc-steps li .st{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .4s}
.proc-steps li .st svg{width:14px;height:14px;opacity:0}
.proc-steps li.active{color:var(--ink)}
.proc-steps li.active .st{border-color:var(--tijolo);border-top-color:transparent;animation:spin 1s linear infinite}
.proc-steps li.done{color:var(--ink-2)}
.proc-steps li.done .st{background:var(--viva);border-color:var(--viva);color:#fff;animation:none}
.proc-steps li.done .st svg{opacity:1}
.proc-note{margin-top:26px;font-size:.84rem;color:var(--muted);max-width:420px}
.crossing{display:grid;place-items:center;text-align:center;min-height:62vh}
.crossing h2{font-size:clamp(1.6rem,3.6vw,2.6rem);max-width:760px;margin:22px auto 18px}
.venn{width:min(340px,80vw);height:auto}
.venn circle{mix-blend-mode:multiply;transform-origin:center;transform-box:fill-box}
.venn .c1{animation:v1 3.2s var(--ease) infinite alternate}
.venn .c2{animation:v2 3.2s var(--ease) infinite alternate}
.venn .c3{animation:v3 3.2s var(--ease) infinite alternate}
@keyframes v1{from{transform:translate(-26px,-10px)}to{transform:translate(0,0)}}
@keyframes v2{from{transform:translate(26px,-10px)}to{transform:translate(0,0)}}
@keyframes v3{from{transform:translate(0,24px)}to{transform:translate(0,0)}}
.cross-msg{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);min-height:1.6em}
@media (max-width:860px){.scan-wrap{grid-template-columns:1fr}.scan{max-width:320px}}

/* =====================================================================
   9. LEITURA DO AMBIENTE (ETAPA 05)
   ===================================================================== */
.reading{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(20px,4vw,48px);align-items:start}
.reading-photo{position:sticky;top:calc(var(--header-h) + 20px)}
.reading-photo .arch-frame{position:relative;aspect-ratio:4/4.8}
.palette-strip{display:flex;height:54px;border-radius:var(--r-md);overflow:hidden;margin-top:14px;box-shadow:var(--shadow)}
.palette-strip div{display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.04em;min-width:0;overflow:hidden;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--argamassa);color:var(--aco);font-size:.88rem;font-weight:500}
.tag.dark{background:var(--aco);color:var(--argamassa)}
.tag.viva{background:var(--viva);color:#fff}
.tag.outline{background:transparent;border:1.5px solid var(--line)}
.blocks{display:grid;gap:14px}
.block{background:var(--card);border-radius:var(--r-lg);padding:clamp(20px,3vw,28px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.block .label{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.block .label .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--argamassa-soft);color:var(--solo)}
.block .label .ic svg{width:18px;height:18px}
.block h3{font-size:1.2rem;font-weight:600}
.block p{color:var(--ink-2);font-size:1.02rem}
.block.feature{background:var(--aco);color:var(--argamassa)}
.block.feature h3{color:#fff}
.block.feature p{color:rgba(227,217,172,.9);font-size:1.12rem}
.block.feature .label .ic{background:rgba(233,179,73,.18);color:var(--tijolo)}
.block.green{background:var(--viva);color:#fff}
.block.green p{color:rgba(255,255,255,.92)}
.block.green .label .ic{background:rgba(255,255,255,.2);color:#fff}
.obs-list{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
.obs-list li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-2)}
.obs-list li::before{content:"";width:10px;height:10px;border-radius:999px 999px 2px 2px;background:var(--tijolo);flex:none;margin-top:8px}
.blocks-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.disclaimer{display:flex;gap:12px;align-items:flex-start;font-size:.86rem;color:var(--ink-2);background:var(--tijolo-soft);border-radius:var(--r-md);padding:14px 16px}
.disclaimer svg{width:18px;height:18px;flex:none;margin-top:2px;color:#9a6a06}
.disclaimer.soft{background:var(--paper-2);border:1px solid var(--line)}
@media (max-width:860px){.reading{grid-template-columns:1fr}.reading-photo{position:relative;top:0;max-width:380px;margin:0 auto;width:100%}.blocks-2{grid-template-columns:1fr}}

/* =====================================================================
   10. CARDS DE RESPOSTA (ETAPAS 06 e 07)
   ===================================================================== */
.react-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.react-card{position:relative;text-align:left;border:0;border-radius:var(--r-lg);padding:26px 22px 24px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:230px;transition:all .35s var(--ease);overflow:hidden}
.react-card .big{font-size:2.6rem;line-height:1}
.react-card .face{width:64px;height:64px}
.react-card h3{font-size:1.35rem;font-weight:600}
.react-card p{color:var(--ink-2);font-size:.95rem}
.react-card .check{position:absolute;top:18px;right:18px}
.react-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.react-card[aria-pressed="true"]{color:#fff}
.react-card[aria-pressed="true"] p{color:rgba(255,255,255,.88)}
.react-card[data-v="sim"][aria-pressed="true"]{background:var(--viva)}
.react-card[data-v="partes"][aria-pressed="true"]{background:var(--tijolo);color:var(--aco)}
.react-card[data-v="partes"][aria-pressed="true"] p{color:rgba(40,49,69,.85)}
.react-card[data-v="nao"][aria-pressed="true"]{background:var(--solo)}
.followup{margin-top:28px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(20px,3.5vw,34px);animation:enter .6s var(--ease)}
.followup h3{font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:600;margin:8px 0 6px}
.followup .sub{color:var(--muted);font-size:.92rem;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:.98rem;font-weight:500;transition:all .25s var(--ease)}
.chip svg{width:18px;height:18px;color:var(--solo);transition:color .25s}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--aco);border-color:var(--aco);color:var(--argamassa)}
.chip[aria-pressed="true"] svg{color:var(--tijolo)}
.chip:active{transform:scale(.97)}
@media (max-width:760px){.react-grid{grid-template-columns:1fr}.react-card{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:18px 54px 18px 18px;gap:6px 14px}.react-card .face{width:46px;height:46px}.react-card p{flex-basis:100%}}

/* Questionário */
.quiz{max-width:900px;margin:0 auto}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.block-tag{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.block-tag b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--urbano);color:var(--argamassa);font-weight:500}
.q-count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.q-dots{display:flex;gap:5px;margin-bottom:26px}
.q-dots i{height:6px;flex:1;border-radius:6px;background:var(--line-2);transition:background .4s}
.q-dots i.on{background:var(--aco)}
.q-dots i.now{background:var(--tijolo)}
.transition-note{display:flex;gap:14px;align-items:flex-start;background:var(--urbano);color:var(--argamassa);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:24px;font-size:1rem;animation:enter .6s var(--ease)}
.transition-note svg{width:22px;height:22px;flex:none;color:var(--tijolo);margin-top:2px}
.q-title{font-size:clamp(1.6rem,3.8vw,2.5rem);font-weight:600;letter-spacing:-.025em;margin-bottom:10px}
.q-help{color:var(--muted);margin-bottom:26px;font-size:.98rem}
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.opt-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.opt{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:18px 18px 18px;display:flex;flex-direction:column;gap:12px;min-height:118px;transition:all .3s var(--ease)}
.opt .oi{width:40px;height:40px;border-radius:999px 999px 10px 10px;background:var(--argamassa-soft);color:var(--solo);display:grid;place-items:center;transition:all .3s}
.opt .oi svg{width:20px;height:20px}
.opt b{font-weight:600;font-size:1.04rem;line-height:1.25}
.opt small{color:var(--muted);font-size:.84rem;line-height:1.35;margin-top:-6px}
.opt .check{position:absolute;top:14px;right:14px;width:24px;height:24px}
.opt .check svg{width:13px;height:13px}
.opt:hover{border-color:var(--ink-2);transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--aco);background:var(--aco);color:var(--argamassa)}
.opt[aria-pressed="true"] small{color:rgba(227,217,172,.75)}
.opt[aria-pressed="true"] .oi{background:var(--tijolo);color:var(--aco)}
.opt.img{padding:0;overflow:hidden;min-height:0}
.opt.img .thumb{aspect-ratio:4/3;overflow:hidden;background:var(--argamassa)}
.opt.img .thumb svg{width:100%;height:100%;transition:transform .6s var(--ease)}
.opt.img:hover .thumb svg{transform:scale(1.05)}
.opt.img .cap{padding:12px 14px 14px;display:grid;gap:2px}
.opt.img small{margin-top:0}
.opt.img .check{background:var(--card)}
.limit-note{margin-top:14px;font-size:.86rem;color:var(--muted);min-height:1.3em}
.limit-note.warn{color:var(--solo)}
.scale{display:grid;gap:14px}
.scale-track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale-btn{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:14px 6px;transition:all .3s var(--ease);font-size:.82rem;color:var(--ink-2)}
.scale-btn .bar{width:14px;border-radius:999px 999px 3px 3px;background:var(--argamassa);transition:all .3s}
.scale-btn[aria-pressed="true"]{background:var(--aco);border-color:var(--aco);color:var(--argamassa)}
.scale-btn[aria-pressed="true"] .bar,.scale-btn.lit .bar{background:var(--tijolo)}
.free-text{margin-top:20px}
.free-text label{display:block;font-weight:500;margin-bottom:8px}
.free-text textarea{width:100%;min-height:96px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);padding:14px 16px;resize:vertical;font-size:1rem;line-height:1.5}
.free-text textarea:focus{outline:none;border-color:var(--aco)}
.free-text .count{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-align:right;margin-top:4px}
@media (max-width:760px){.opt-grid,.opt-grid.cols-4{grid-template-columns:repeat(2,1fr)}.opt-grid.cols-2{grid-template-columns:1fr}.opt{min-height:104px;padding:14px}.opt b{font-size:.98rem}.scale-btn{min-height:84px;font-size:.72rem}}
@media (max-width:380px){.opt-grid{grid-template-columns:1fr}.opt-grid.img-grid{grid-template-columns:repeat(2,1fr)}}

/* =====================================================================
   11. TERMÔMETRO / RESULTADO (ETAPA 09)
   ===================================================================== */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px);align-items:center}
.gauge-card{background:var(--aco);color:var(--argamassa);border-radius:var(--r-xl);padding:clamp(24px,4vw,44px);position:relative;overflow:hidden;text-align:center}
.gauge-card .bg-arcs{position:absolute;inset:0;opacity:.18;pointer-events:none}
.gauge{position:relative;width:min(340px,78vw);margin:0 auto}
.gauge svg{width:100%;height:auto;overflow:visible}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6%}
.gauge .val{font-size:clamp(3.6rem,10vw,5.4rem);font-weight:700;letter-spacing:-.05em;line-height:1;color:#fff}
.gauge .val small{font-size:.42em;font-weight:500;margin-left:2px;color:var(--tijolo)}
.gauge .lbl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-top:6px}
.band-pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 16px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--aco);background:var(--tijolo);opacity:0;transform:translateY(8px);transition:all .6s var(--ease)}
.band-pill.show{opacity:1;transform:none}
.band-scale{display:grid;grid-template-columns:39fr 20fr 20fr 21fr;gap:3px;margin-top:22px;font-family:var(--f-mono);font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;text-align:left}
.band-scale div{padding-top:8px;border-top:4px solid;opacity:.55;transition:opacity .4s}
.band-scale div.on{opacity:1}
.result-text h2{font-size:clamp(1.9rem,4.4vw,3.1rem);margin:12px 0 16px}
.result-text .lead{font-size:1.15rem;color:var(--ink-2);margin-bottom:26px}
.dims{display:grid;gap:16px}
.dim{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.dim .n{font-weight:500;display:flex;align-items:center;gap:10px}
.dim .n small{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);letter-spacing:.06em}
.dim .v{font-weight:600;font-variant-numeric:tabular-nums}
.dim .track{grid-column:1/-1;height:12px;border-radius:12px;background:var(--line-2);overflow:hidden}
.dim .track span{display:block;height:100%;width:0;border-radius:12px;transition:width 1.4s var(--ease)}
.profile-card{margin-top:clamp(28px,4vw,48px);display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;background:var(--urbano);color:var(--argamassa);border-radius:var(--r-xl);padding:clamp(22px,3.5vw,36px)}
.profile-card .seal{width:96px;height:96px}
.profile-card h3{font-size:clamp(1.5rem,3vw,2.1rem);color:#fff;margin:6px 0 8px}
.profile-card p{opacity:.88}
.how-btn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:4px;color:var(--ink-2);font-size:.9rem;margin-top:16px;display:inline-flex;align-items:center;gap:8px}
.how-btn svg{width:16px;height:16px}
.reveal{opacity:0;transform:translateY(14px);transition:all .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (max-width:860px){.result-grid{grid-template-columns:1fr}.profile-card{grid-template-columns:auto 1fr}.profile-card .btn{grid-column:1/-1}.profile-card .seal{width:64px;height:64px}}

/* =====================================================================
   12. BOOK DE SUGESTÕES (ETAPA 10)
   ===================================================================== */
.book-head{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end;margin-bottom:34px}
.book-head h2{font-size:clamp(2rem,5vw,3.5rem);margin-top:12px}
.book-head p{color:var(--ink-2)}
.sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:clamp(28px,5vw,52px)}
.sw{border-radius:var(--r-xl);padding:clamp(22px,3vw,32px)}
.sw.ok{background:var(--viva-soft)}
.sw.mis{background:var(--solo-soft)}
.sw h3{font-size:1.35rem;margin:8px 0 14px;display:flex;align-items:center;gap:12px}
.sw h3 .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.sw.ok h3 .ic{background:var(--viva);color:#fff}
.sw.mis h3 .ic{background:var(--solo);color:#fff}
.sw h3 svg{width:18px;height:18px}
.sw ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sw li{background:rgba(255,255,255,.6);border-radius:var(--r-md);padding:14px 16px;color:var(--ink-2);font-size:.97rem}
.sw li b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
.levels{display:grid;gap:clamp(24px,4vw,40px)}
.level-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.level-num{font-size:clamp(2.6rem,6vw,4rem);font-weight:700;letter-spacing:-.05em;line-height:.9;color:var(--solo)}
.level-head h3{font-size:clamp(1.3rem,2.6vw,1.8rem)}
.level-head p{color:var(--muted);font-size:.92rem}
.level-head .meter{margin-left:auto;display:flex;gap:4px}
.level-head .meter i{width:26px;height:8px;border-radius:8px;background:var(--line)}
.level-head .meter i.on{background:var(--aco)}
.recs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rec{background:var(--card);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--c,var(--viva))}
.rec h4{font-size:1.15rem;font-weight:600;line-height:1.25}
.rec .kv{display:grid;gap:10px;font-size:.93rem;color:var(--ink-2)}
.rec .kv div{display:grid;grid-template-columns:22px 1fr;gap:10px}
.rec .kv svg{width:18px;height:18px;margin-top:2px;color:var(--solo)}
.rec .kv b{color:var(--ink);font-weight:600}
.rec .foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.pill-s{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
@media (max-width:860px){.book-head,.sw-grid,.recs{grid-template-columns:1fr}}

/* =====================================================================
   13. RELATÓRIO FINAL (ETAPA 11)
   ===================================================================== */
.report-actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.doc{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden}
.doc-mast{background:var(--aco);color:var(--argamassa);padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1fr auto;gap:20px;position:relative;overflow:hidden}
.doc-mast .pat{position:absolute;right:0;top:0;bottom:0;width:38%;opacity:.9}
.doc-mast h2{font-size:clamp(1.7rem,4vw,2.9rem);color:#fff;max-width:640px;position:relative;margin-top:12px}
.doc-mast .meta{position:relative;display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.doc-body{padding:clamp(22px,4vw,48px);display:grid;gap:clamp(26px,4vw,44px)}
.doc-sec{display:grid;grid-template-columns:200px 1fr;gap:24px;padding-top:clamp(22px,3vw,32px);border-top:1px solid var(--line)}
.doc-sec:first-child{border-top:0;padding-top:0}
.doc-sec>h3{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--solo);font-weight:500;line-height:1.5}
.doc-sec>h3 span{display:block;font-family:var(--f-display);font-size:2rem;letter-spacing:-.04em;color:var(--ink);text-transform:none;font-weight:600;line-height:1}
.doc-row{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.doc-row .arch-frame{position:relative;aspect-ratio:4/4.8;box-shadow:none}
.doc p.big{font-size:1.18rem;color:var(--ink)}
.doc p{color:var(--ink-2)}
.doc-score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.doc-score .ring{width:150px;height:150px}
.doc-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.doc-two ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);display:grid;gap:6px}
.doc-two h4{font-size:1rem}
.doc-recs{display:grid;gap:10px}
.doc-recs div{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--line)}
.doc-recs div:last-child{border-bottom:0}
.doc-recs .lv{font-family:var(--f-mono);font-size:.66rem;padding:4px 8px;border-radius:999px;background:var(--argamassa);color:var(--aco);white-space:nowrap}
.doc-foot{background:var(--paper-2);border-top:1px solid var(--line);padding:18px clamp(22px,4vw,48px);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
@media (max-width:760px){.doc-sec{grid-template-columns:1fr;gap:12px}.doc-row{grid-template-columns:1fr}.doc-row .arch-frame{max-width:240px}.doc-two{grid-template-columns:1fr}.doc-score{grid-template-columns:1fr;justify-items:start}.doc-mast{grid-template-columns:1fr}.doc-mast .pat{width:55%;opacity:.35}}

/* Avaliação */
.rate{margin-top:clamp(36px,6vw,64px);background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(24px,4vw,44px);text-align:center}
.rate h3{font-size:clamp(1.6rem,3.4vw,2.3rem);margin:10px 0 8px}
.rate>p{color:var(--ink-2)}
.stars{display:inline-flex;gap:6px;margin:24px 0 8px}
.star{width:60px;height:60px;border:0;background:none;padding:6px;border-radius:50%;transition:transform .2s var(--ease)}
.star svg{width:100%;height:100%}
.star svg path{fill:var(--line-2);stroke:var(--line);stroke-width:1.2;transition:fill .2s,stroke .2s}
.star.lit svg path{fill:var(--tijolo);stroke:#cf9a2f}
.star:hover{transform:scale(1.12) rotate(-6deg)}
.star.pop{animation:pop .45s var(--ease)}
@keyframes pop{50%{transform:scale(1.35)}}
.rate-msg{min-height:1.6em;font-weight:600;font-size:1.1rem;color:var(--solo)}
.rate textarea{width:100%;max-width:560px;min-height:84px;margin:16px auto 0;display:block;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);padding:12px 14px;resize:vertical}
.rate .fine{font-size:.8rem;color:var(--muted);margin-top:8px}
.rate .done{display:grid;justify-items:center;gap:10px;animation:enter .6s var(--ease)}
.rate .done .ok{width:64px;height:64px;border-radius:50%;background:var(--viva);color:#fff;display:grid;place-items:center}
.rate .done .ok svg{width:30px;height:30px}
@media (max-width:420px){.star{width:52px;height:52px}}

/* Conexão comercial */
.cta-led{margin-top:clamp(28px,5vw,48px);border-radius:var(--r-xl);overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr;background:var(--urbano);color:var(--argamassa)}
.cta-led .txt{padding:clamp(26px,5vw,56px)}
.cta-led h3{font-size:clamp(1.8rem,4.2vw,3rem);color:#fff;margin:14px 0 18px;letter-spacing:-.03em}
.cta-led p{opacity:.9;margin-bottom:14px;max-width:560px}
.cta-led .btn{margin-top:14px}
.cta-led .vis{position:relative;min-height:260px}
.cta-led .vis svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:860px){.cta-led{grid-template-columns:1fr}.cta-led .vis{min-height:160px;order:-1}}

/* =====================================================================
   14. CONQUISTAS, MODAIS, CONSENTIMENTO, RODAPÉ
   ===================================================================== */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;top:calc(var(--header-h) + 14px);z-index:60;transform:translateY(-20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);padding:10px 20px 10px 10px;border-radius:28px;box-shadow:var(--shadow-lg);transition:all .5s var(--ease)}
.toast.show{opacity:1;transform:none}
.toast .medal{width:40px;height:40px;flex:none}
.toast b{display:block;font-size:.95rem}
.toast small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(31,36,51,.5);backdrop-filter:blur(4px);display:grid;place-items:end center;padding:0;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:clamp(22px,4vw,36px);animation:sheet .45s var(--ease) both;position:relative}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@media (min-width:760px){.modal-back{place-items:center;padding:24px}.modal{border-radius:var(--r-xl)}}
.modal h3{font-size:1.6rem;margin:8px 0 14px;padding-right:44px}
.modal .close{position:absolute;top:18px;right:18px}
.modal p,.modal li{color:var(--ink-2);font-size:.95rem}
.modal ul{padding-left:18px;display:grid;gap:6px}
.qa{display:grid;gap:10px;margin-top:10px}
.qa div{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:12px 14px}
.qa small{grid-column:1;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qa b{grid-column:1;font-weight:500}
.qa button{grid-column:2;grid-row:1/3;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:8px 14px;font-size:.84rem}
.qa button:hover{border-color:var(--ink)}
.contrib{display:grid;gap:6px;margin-top:8px}
.contrib div{display:flex;justify-content:space-between;gap:14px;font-size:.88rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.contrib .pos{color:var(--viva-deep);font-weight:600}
.contrib .neg{color:var(--solo);font-weight:600}
.consent{position:fixed;left:16px;right:16px;bottom:16px;z-index:65;max-width:560px;margin-left:auto;background:var(--aco);color:var(--argamassa);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-lg);animation:sheet .5s var(--ease) both}
.consent p{font-size:.9rem;opacity:.92}
.consent p b{color:#fff}
.consent .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.consent button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(227,217,172,.4);background:transparent;color:var(--argamassa);font-size:.9rem}
.consent button.yes{background:var(--tijolo);border-color:var(--tijolo);color:var(--aco);font-weight:600}
.consent button.link{border:0;text-decoration:underline;padding:0 6px}
.site-foot{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom));font-size:.82rem;color:var(--muted)}
.site-foot .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.site-foot .credit{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.site-foot nav{display:flex;flex-wrap:wrap;gap:16px}
.site-foot button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:.82rem}
@media (max-width:640px){body.has-dock .site-foot{padding-bottom:96px}}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}

/* Movimento reduzido */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* =====================================================================
   15. IMPRESSÃO / PDF DO RELATÓRIO
   ===================================================================== */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .topbar,.site-foot,.toast,.consent,.report-actions,.rate,.cta-led,.actions,.no-print{display:none!important}
  .screen{padding:0;animation:none}
  .wrap{max-width:none;padding:0}
  .doc{box-shadow:none;border-radius:0}
  .doc-mast,.tag,.doc-recs .lv,.dim .track span,.palette-strip div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-sec{break-inside:avoid}
  .reveal{opacity:1!important;transform:none!important}
}

const icon = (n, w=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[n]||ICON_PATHS.spark}</svg>`;

/* ---------------------------------------------------------------------
   C. ILUSTRAÇÕES — composições de interiores em SVG, na paleta da
   experiência. Arcos, cobogós e curvas derivados da linguagem visual
   do Branding Book. Podem ser substituídas por fotografias (config.js).

let artSeq = 0;
const P = { viva:"#9CAA39", vivaD:"#6E7A1F", arg:"#E3D9AC", argL:"#EFE9CF", urb:"#3E162F", aco:"#283145", tij:"#E9B349", solo:"#9D491F", paper:"#F4F0E6", wood:"#B9824F", woodD:"#8C5A32", graf:"#3A3D44" };

function patternDefs(id, color, bg){
  /* módulo "arco + barra" — inspirado em cobogós (desenho próprio) */
  return `<pattern id="${id}" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="${bg}"/>
    <path d="M2 22V12a8 8 0 0 1 16 0v10z" fill="${color}"/>
    <rect x="20" y="2" width="3" height="20" rx="1.5" fill="${color}"/></pattern>`;
}
function plantSVG(x, y, s=1, c=P.viva, pot=P.solo){
  const leaves = [[-26,-40,-35],[22,-46,30],[-6,-62,-6],[-34,-18,-62],[30,-22,58],[6,-36,12]];
  return `<g transform="translate(${x},${y}) scale(${s})">
    ${leaves.map(([dx,dy,r],i)=>`<ellipse cx="${dx}" cy="${dy}" rx="9" ry="24" transform="rotate(${r} ${dx} ${dy})" fill="${i%2?c:shade(c,-18)}"/>`).join("")}
    <path d="M-16 -6h32l-4 26h-24z" fill="${pot}"/><rect x="-18" y="-10" width="36" height="7" rx="3" fill="${shade(pot,-15)}"/></g>`;
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* roomArt(o): o.type = sala | quarto | cozinha ; o.style ; o.night ; o.objects (0–3) ... */
function roomArt(o={}){
  const id = "ra" + (++artSeq);
  const t = o.type || "sala";
  const wall = o.wall || P.argL, floor = o.floor || "#D8C7A0", accent = o.accent || P.solo, accent2 = o.accent2 || P.tij;
  const night = !!o.night, objs = o.objects ?? 1, plants = o.plants ?? 1, style = o.style || "contemporaneo";
  const sky = night ? `<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2236"/><stop offset="1" stop-color="#3E3550"/></linearGradient>`
                    : `<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD3D9"/><stop offset="1" stop-color="#F3E3BE"/></linearGradient>`;
  let s = `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(o.label||"Ilustração de interior")}"><defs>${sky}
    <radialGradient id="${id}g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".85"/><stop offset="1" stop-color="#FFD58A" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}b" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${night?0:.55}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    ${patternDefs(id+"p", o.patColor || P.paper, o.patBg || accent)}</defs>`;
  s += `<rect width="400" height="300" fill="${wall}"/>`;
  // detalhes de parede por estilo
  if (style === "classico") s += `<g fill="none" stroke="${shade(wall,-22)}" stroke-width="2"><rect x="160" y="40" width="80" height="120" rx="2"/><rect x="250" y="40" width="80" height="120" rx="2"/><rect x="340" y="40" width="70" height="120" rx="2"/><path d="M0 30h400" stroke-width="5"/></g>`;
  if (style === "industrial") { s += `<g stroke="${shade(wall,-28)}" stroke-width="1.5">`; for (let yy=20; yy<220; yy+=16){ s += `<path d="M150 ${yy}h250"/>`; for (let xx=150+((yy/16)%2)*18; xx<400; xx+=36) s += `<path d="M${xx} ${yy}v16"/>`; } s += `</g>`; }
  if (style === "tropical") s += `<rect x="300" y="20" width="100" height="200" fill="url(#${id}p)" opacity=".9"/>`;
  if (style === "organico") s += `<path d="M170 222V110a75 75 0 0 1 150 0v112z" fill="${shade(wall,-14)}"/>`;
  if (style === "contemporaneo") s += `<rect x="290" y="0" width="110" height="222" fill="${o.block || shade(wall,-10)}"/>`;
  // janela em arco
  if (o.window !== "none"){
    const wx=36, ww=96;
    s += `<path d="M${wx} 200V96a${ww/2} ${ww/2} 0 0 1 ${ww} 0v104z" fill="url(#${id}s)"/>`;
    if (night) s += `<circle cx="${wx+66}" cy="80" r="9" fill="#F3E3BE" opacity=".9"/>`;
    s += `<g stroke="${style==="industrial"?P.graf:"#fff"}" stroke-width="${style==="industrial"?4:3}" fill="none"><path d="M${wx} 200V96a${ww/2} ${ww/2} 0 0 1 ${ww} 0v104z"/><path d="M${wx+ww/2} 48v152M${wx} 130h${ww}"/></g>`;
    if (!night) s += `<path d="M${wx} 200 L${wx+ww} 200 L${wx+ww+150} 300 L${wx-20} 300z" fill="url(#${id}b)"/>`;
  }
  // piso
  s += `<rect y="222" width="400" height="78" fill="${floor}"/><rect y="218" width="400" height="6" fill="${shade(floor,-24)}"/>`;
  if (o.wood) for (let i=0;i<9;i++) s += `<path d="M${i*50} 224 L${i*50-30} 300" stroke="${shade(floor,-14)}" stroke-width="1.5"/>`;
  // pendentes / luz
  const lampC = style==="industrial" ? P.graf : (o.lamp || P.aco);
  const lamp = (x, len=50) => `<path d="M${x} 0v${len}" stroke="${lampC}" stroke-width="2"/>` + (night ? `<circle cx="${x}" cy="${len+22}" r="58" fill="url(#${id}g)"/>` : "") + `<path d="M${x-16} ${len+16}a16 16 0 0 1 32 0z" fill="${lampC}"/><circle cx="${x}" cy="${len+17}" r="4" fill="${night?"#FFE2A6":accent2}"/>`;

  if (t === "sala"){
    s += `<ellipse cx="250" cy="262" rx="130" ry="22" fill="${o.rug || shade(accent2,10)}" opacity=".85"/>`;
    if (objs>0) s += `<g><rect x="208" y="70" width="52" height="66" rx="3" fill="${P.paper}" stroke="${shade(wall,-35)}" stroke-width="3"/><circle cx="234" cy="103" r="15" fill="${accent}"/><path d="M272 136V96a20 20 0 0 1 40 0v40z" fill="${P.aco}"/></g>`;
    if (objs>2) s += `<g><rect x="322" y="88" width="40" height="48" rx="3" fill="${accent2}"/><rect x="186" y="112" width="16" height="24" rx="2" fill="${P.viva}"/></g>`;
    // sofá
    const sc = o.sofa || P.aco;
    s += `<rect x="168" y="158" width="190" height="52" rx="18" fill="${sc}"/><rect x="156" y="182" width="214" height="44" rx="16" fill="${shade(sc,14)}"/>
          <rect x="182" y="170" width="44" height="30" rx="10" fill="${accent2}"/><rect x="300" y="170" width="44" height="30" rx="10" fill="${objs>1?accent:shade(sc,30)}"/>
          <path d="M170 226v8M356 226v8" stroke="${P.woodD}" stroke-width="5" stroke-linecap="round"/>`;
    s += `<ellipse cx="264" cy="250" rx="46" ry="9" fill="${o.wood?P.woodD:P.graf}"/><rect x="261" y="250" width="6" height="18" fill="${o.wood?P.woodD:P.graf}"/>`;
    if (objs>1) s += `<rect x="242" y="236" width="22" height="8" rx="2" fill="${accent}"/><path d="M276 244v-14a5 5 0 0 1 10 0v14z" fill="${P.viva}"/>`;
    s += night ? lamp(110,40) : `<path d="M150 232V120" stroke="${P.graf}" stroke-width="3"/><path d="M134 128a16 14 0 0 1 32 0z" fill="${accent2}"/>`;
  }
  if (t === "quarto"){
    s += `<ellipse cx="260" cy="270" rx="140" ry="20" fill="${o.rug || shade(floor,-10)}" opacity=".8"/>`;
    s += `<path d="M186 214V136a74 60 0 0 1 148 0v78z" fill="${o.head || P.urb}"/>`;
    if (objs>0) s += `<circle cx="260" cy="88" r="20" fill="${accent2}"/><path d="M238 88h44" stroke="${shade(wall,-30)}" stroke-width="2"/>`;
    s += `<rect x="168" y="190" width="184" height="46" rx="12" fill="${P.paper}"/><rect x="200" y="172" width="54" height="26" rx="12" fill="#fff"/><rect x="266" y="172" width="54" height="26" rx="12" fill="#fff"/>
          <path d="M168 206h184v30a12 12 0 0 1-12 12H180a12 12 0 0 1-12-12z" fill="${o.blanket || accent}"/>
          <rect x="356" y="200" width="36" height="40" rx="6" fill="${o.wood?P.wood:P.aco}"/><rect x="128" y="200" width="36" height="40" rx="6" fill="${o.wood?P.wood:P.aco}"/>`;
    s += night ? `<circle cx="146" cy="186" r="44" fill="url(#${id}g)"/>` : "";
    s += `<path d="M138 200v-14h16v14z" fill="${accent2}"/><path d="M134 186l6-16h12l6 16z" fill="${night?"#FFE2A6":P.paper}"/>`;
    if (objs>1) s += `<rect x="362" y="190" width="24" height="10" rx="2" fill="${accent2}"/><rect x="366" y="182" width="16" height="8" rx="2" fill="${P.viva}"/>`;
    if (objs>2) s += `<g><rect x="200" y="60" width="30" height="40" rx="3" fill="${P.aco}"/><rect x="290" y="56" width="34" height="46" rx="3" fill="${accent}"/></g>`;
  }
  if (t === "cozinha"){
    const cab = o.cab || P.aco;
    s += `<rect x="150" y="70" width="250" height="8" rx="3" fill="${o.wood?P.woodD:P.graf}"/>`;
    if (objs>0) s += `<g><rect x="168" y="50" width="16" height="20" rx="3" fill="${accent}"/><rect x="190" y="44" width="16" height="26" rx="3" fill="${accent2}"/><circle cx="226" cy="60" r="10" fill="${P.paper}" stroke="${P.aco}" stroke-width="2"/><rect x="250" y="46" width="22" height="24" rx="4" fill="${P.viva}"/></g>`;
    if (objs>2) s += `<g><rect x="290" y="48" width="14" height="22" rx="3" fill="${accent}"/><rect x="310" y="40" width="14" height="30" rx="3" fill="${P.urb}"/><rect x="330" y="52" width="26" height="18" rx="3" fill="${accent2}"/></g>`;
    s += `<rect x="150" y="150" width="250" height="12" rx="3" fill="${o.top || P.paper}"/><rect x="156" y="162" width="244" height="62" fill="${cab}"/>`;
    for (let x=160; x<400; x+=48) s += `<rect x="${x}" y="168" width="42" height="50" rx="4" fill="none" stroke="${shade(cab,22)}" stroke-width="2"/><path d="M${x+21} 186v12" stroke="${accent2}" stroke-width="3" stroke-linecap="round"/>`;
    s += `<path d="M190 150v-20h10M250 132a14 9 0 0 1 28 0v18h-28z" fill="${P.graf}" stroke="${P.graf}" stroke-width="3"/>`;
    if (objs>1) s += `<ellipse cx="330" cy="146" rx="20" ry="6" fill="${o.wood?P.wood:P.paper}"/><circle cx="324" cy="140" r="6" fill="${accent2}"/><circle cx="335" cy="139" r="6" fill="${P.viva}"/>`;
    s += `<g fill="${o.wood?P.wood:P.graf}"><rect x="40" y="236" width="40" height="8" rx="4"/><path d="M46 244l-6 46M74 244l6 46" stroke="${o.wood?P.woodD:P.graf}" stroke-width="4"/></g>`;
    s += lamp(220, 30) + lamp(330, 30);
  }
  for (let i=0;i<plants;i++) s += plantSVG(i===0 ? (t==="cozinha"?110:120) : 380, i===0 ? 248 : 230, i===0?0.95:0.7, i===1?P.vivaD:P.viva, i===1?P.tij:P.solo);
  if (night) s += `<rect width="400" height="300" fill="#1B1F2E" opacity=".28"/>`;
  return s + `</svg>`;
}

/* Arcos concêntricos (elemento gráfico) */
function arcsSVG(color="#fff", n=6){
  let s = `<svg class="arcs" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`;
  for (let i=1;i<=n;i++){ const r = i*70; s += `<circle cx="400" cy="150" r="${r}" fill="none" stroke="${color}" stroke-width="1.2"/>`; }
  return s + `</svg>`;

function patternBand(color=P.aco, bg=P.arg, h=84){

function medalSVG(n){

/* ---------------------------------------------------------------------
   D. LEITURA LOCAL DA IMAGEM
   Mede luz, temperatura de cor, saturação, contraste, densidade visual
   (bordas) e paleta predominante. Usada (1) para a pré-análise visual no
   modo demonstração, (2) como métrica explícita no cálculo de
   compatibilidade e (3) para os pontos de atenção da animação.
   Nada é enviado para fora do navegador nesta etapa.
   --------------------------------------------------------------------- */
const ACCEPTED = ["image/jpeg","image/png","image/webp"];
const MAX_BYTES = 15 * 1024 * 1024;

function validateFile(file){
  if (!file) return "Nenhum arquivo selecionado.";
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  const okType = ACCEPTED.includes(file.type) || (!file.type && ["jpg","jpeg","png","webp"].includes(ext));
  if (!okType){
    if (/hei[cf]/i.test(file.type) || /hei[cf]/.test(ext)) return "Fotos no formato HEIC (padrão do iPhone) não são aceitas aqui. Em Ajustes › Câmera › Formatos, escolha “Mais compatível”, ou envie uma captura de tela da foto.";
    return "Este arquivo não é uma imagem aceita. Envie uma foto em JPG, JPEG, PNG ou WEBP.";
  }
  if (file.size > MAX_BYTES) return "A imagem tem mais de 15 MB. Escolha uma versão menor da foto.";
  if (file.size < 8 * 1024) return "Esta imagem parece pequena demais para uma boa leitura. Tente uma foto com mais resolução.";
  return null;
}
function readImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
function drawScaled(img, maxSide, quality=.86){
  const r = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*r)), h = Math.max(1, Math.round(img.naturalHeight*r));
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  const ctx = c.getContext("2d", { willReadFrequently:true }); ctx.drawImage(img,0,0,w,h);
  return { canvas:c, ctx, w, h, dataUrl:()=>c.toDataURL("image/jpeg", quality) };
}
function rgb2hsl(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0, s=0; const l=(mx+mn)/2; if (mx!==mn){ const d=mx-mn; s = l>.5 ? d/(2-mx-mn) : d/(mx+mn); h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; } return [h,s,l]; }
const toHex = (r,g,b) => "#" + [r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
function colorName(r,g,b){
  const [h,s,l] = rgb2hsl(r,g,b);
  if (l > .9) return "branco"; if (l < .12) return "preto";
  if (s < .12) return l > .7 ? "off-white" : l > .45 ? "cinza" : "grafite";
  if (h < 18 || h >= 345) return l < .35 ? "vinho" : s > .45 ? "vermelho" : "rosado";
  if (h < 45) return l < .35 ? "marrom" : l > .72 ? "bege" : s > .5 ? "terracota" : "amadeirado";
  if (h < 65) return l > .7 ? "areia" : s > .5 ? "mostarda" : "oliva claro";
  if (h < 160) return l < .3 ? "verde escuro" : "verde";
  if (h < 200) return "verde-água";
  if (h < 255) return l < .3 ? "azul profundo" : "azul";
  if (h < 300) return "lilás";
  return "rosa";
}
function analyzeImageLocal(img){
  const { ctx, w, h } = drawScaled(img, 160);
  const d = ctx.getImageData(0,0,w,h).data;
  const n = w*h, gray = new Float32Array(n);
  let sumL=0, sumL2=0, sumWarm=0, sumS=0, rg=[], yb=[], green=0, woodC=0;
  const GX=4, GY=4, cells = Array.from({length:GX*GY},()=>({l:0,s:0,e:0,n:0}));
  const samples = [];
  for (let i=0;i<n;i++){
    const r=d[i*4], g=d[i*4+1], b=d[i*4+2];
    const L = (0.2126*r + 0.7152*g + 0.0722*b)/255; gray[i]=L;
    const [hh,ss,ll] = rgb2hsl(r,g,b);
    sumL+=L; sumL2+=L*L; sumWarm += (r-b)/255; sumS += ss;
    rg.push(r-g); yb.push(.5*(r+g)-b);
    if (hh>=70 && hh<=165 && ss>.18 && ll>.12 && ll<.8) green++;
    if (hh>=18 && hh<=45 && ss>.22 && ss<.75 && ll>.2 && ll<.62) woodC++;
    const x=i%w, y=(i/w)|0, ci = Math.min(GY-1,(y*GY/h)|0)*GX + Math.min(GX-1,(x*GX/w)|0);
    cells[ci].l += L; cells[ci].s += ss; cells[ci].n++;
    if (i % 3 === 0) samples.push([r,g,b]);
  }
  // densidade visual: magnitude de gradiente
  let edges=0;
  for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++){
    const i=y*w+x, gx = gray[i+1]-gray[i-1], gy = gray[i+w]-gray[i-w], m = Math.hypot(gx,gy);
    if (m > .09){ edges++; const ci = Math.min(GY-1,(y*GY/h)|0)*GX + Math.min(GX-1,(x*GX/w)|0); cells[ci].e++; }
  }
  const meanL = sumL/n, stdL = Math.sqrt(Math.max(0, sumL2/n - meanL*meanL));
  const mean = a => a.reduce((x,y)=>x+y,0)/a.length, std = (a,m) => Math.sqrt(mean(a.map(v=>(v-m)**2)));
  const mrg = mean(rg), myb = mean(yb);
  const colorfulMetric = Math.sqrt(std(rg,mrg)**2 + std(yb,myb)**2) + .3*Math.sqrt(mrg**2+myb**2); // Hasler–Süsstrunk
  const edgeRatio = edges / ((w-2)*(h-2));
  cells.forEach(c => { c.l/=c.n||1; c.s/=c.n||1; c.e/=c.n||1; });
  const left = mean(cells.filter((_,i)=>i%GX<2).map(c=>c.l)), right = mean(cells.filter((_,i)=>i%GX>=2).map(c=>c.l));
  const top = mean(cells.slice(0,GX*2).map(c=>c.l)), bottom = mean(cells.slice(GX*2).map(c=>c.l));
  // paleta: k-means simples (k=5)
  const K=5; let cents = [];
  const sorted = samples.slice().sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  for (let k=0;k<K;k++) cents.push(sorted[Math.floor((k+.5)*sorted.length/K)].slice());
  let assign = new Array(samples.length).fill(0);
  for (let it=0; it<8; it++){
    const acc = cents.map(()=>[0,0,0,0]);
    samples.forEach((p,i)=>{ let bi=0, bd=1e9; cents.forEach((c,k)=>{ const dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2; if (dd<bd){bd=dd;bi=k;} }); assign[i]=bi; const a=acc[bi]; a[0]+=p[0];a[1]+=p[1];a[2]+=p[2];a[3]++; });
    cents = acc.map((a,k)=> a[3] ? [a[0]/a[3],a[1]/a[3],a[2]/a[3]] : cents[k]);
  }
  const counts = cents.map(()=>0); assign.forEach(k=>counts[k]++);
  const palette = cents.map((c,k)=>({ hex:toHex(...c), name:colorName(...c), share:counts[k]/samples.length, lum:(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255 }))
    .filter(p=>p.share>.03).sort((a,b)=>b.share-a.share);
  // pontos de atenção (para a animação e observações)
  const cellPos = i => ({ x:((i%GX)+.5)/GX*100, y:(((i/GX)|0)+.5)/GY*100 });
  const idxMax = f => cells.reduce((bi,c,i,arr)=> f(c)>f(arr[bi])?i:bi, 0);
  const iLight = idxMax(c=>c.l), iColor = idxMax(c=>c.s), iDetail = idxMax(c=>c.e), iShadow = idxMax(c=>-c.l);
  const regionName = i => { const r=(i/GX)|0, c=i%GX; return (r<2?"superior":"inferior") + " " + (c<1?"esquerda":c>2?"direita":"central"); };
  const traits = {
    brightness: Math.round(clamp((meanL - .12) / .62 * 100, 0, 100)),
    warmth: Math.round(clamp(50 + (sumWarm/n) * 260, 0, 100)),
    colorfulness: Math.round(clamp(colorfulMetric / 75 * 100, 0, 100)),
    complexity: Math.round(clamp((edgeRatio - .03) / .25 * 100, 0, 100)),
    naturalness: Math.round(clamp((green/n)*260 + (woodC/n)*130, 0, 100)),
    contrast: Math.round(clamp(stdL / .28 * 100, 0, 100))
  };
  return {
    traits, palette,
    greenShare: green/n, woodShare: woodC/n,
    lightSide: Math.abs(left-right) > .07 ? (left>right?"esquerdo":"direito") : null,
    lightTop: top - bottom > .08,
    hotspots: [
      { ...cellPos(iLight),  label:"luz",     region:regionName(iLight) },
      { ...cellPos(iColor),  label:"cor",     region:regionName(iColor) },
      { ...cellPos(iDetail), label:"detalhes",region:regionName(iDetail) },
      { ...cellPos(iShadow), label:"sombra",  region:regionName(iShadow) }
    ].filter((p,i,a)=>a.findIndex(q=>q.x===p.x&&q.y===p.y)===i),
    quality: { tooDark: meanL < .14, tooFlat: stdL < .05 }
  };
}

/* Interpretação de demonstração — gerada a partir das medidas acima.
   Não é IA: é um conjunto de regras sobre luz, cor e densidade visual. */
function demoInterpretation(F, envId){
  const t = F.traits, env = ENVS[envId];
  const tags = [];
  if (t.warmth >= 58 && t.brightness >= 45) tags.push("Acolhedora");
  if (t.brightness >= 66) tags.push("Luminosa");
  if (t.brightness < 40) tags.push("Intimista");
  if (t.complexity < 30) tags.push("Minimalista");
  if (t.complexity > 62) tags.push("Cheia de camadas");
  if (t.colorfulness > 55) tags.push("Vibrante");
  if (t.colorfulness < 26 && t.complexity < 50) tags.push("Serena");
  if (t.naturalness > 45) tags.push("Orgânica");
  if (t.warmth < 44 && t.colorfulness < 45) tags.push("Contemporânea");
  if (t.contrast > 66 && t.colorfulness < 45) tags.push("Sofisticada");
  if (!tags.length) tags.push("Equilibrada", "Informal");
  const atm = tags.slice(0,3);

  const light = t.brightness >= 66 ? "bastante luminoso" : t.brightness >= 42 ? "com luminosidade equilibrada" : "com luz mais baixa e recolhida";
  const temp = t.warmth >= 60 ? "predominância de tons quentes" : t.warmth <= 42 ? "predominância de tons frios" : "uma temperatura de cor neutra";
  const color = t.colorfulness < 25 ? "uma paleta contida, quase monocromática" : t.colorfulness < 52 ? "uma paleta suave, com alguns pontos de contraste" : "cores marcantes que chamam a atenção";
  const dens = t.complexity < 30 ? "poucos elementos visuais e áreas livres" : t.complexity < 62 ? "um equilíbrio entre áreas livres e objetos" : "muitas camadas visuais — objetos, texturas e detalhes";
  const names = [...new Set(F.palette.slice(0,3).map(p=>p.name))];

  const experienceMap = {
    sala: t.complexity > 62 ? "convivência e afeto, com memórias e referências à vista" : t.brightness < 40 ? "noites mais intimistas, filmes e conversas próximas" : t.complexity < 30 ? "momentos de pausa e conversas tranquilas, sem excesso de estímulos" : "um uso versátil, entre o descanso e o encontro com outras pessoas",
    quarto: t.brightness < 42 && t.warmth >= 50 ? "recolhimento e descanso" : t.brightness >= 66 && t.warmth < 50 ? "um uso mais ativo durante o dia" : t.complexity > 62 ? "várias atividades além do sono" : "descanso com algum espaço para a individualidade",
    cozinha: t.complexity > 62 ? "uma rotina intensa, com utensílios e objetos à mão" : t.complexity < 30 ? "um uso objetivo e organizado" : t.warmth >= 58 ? "encontros em torno da comida" : "uma rotina prática, com espaço para o dia a dia"
  };

  const obs = [];
  if (names.length) obs.push(`A paleta predominante combina ${listPt(names)}, que ocupam boa parte da imagem.`);
  if (F.lightSide) obs.push(`A luz parece chegar com mais força pelo lado ${F.lightSide} da foto, o que cria uma leitura de profundidade.`);
  else if (F.lightTop) obs.push("A parte superior da imagem é mais clara, sugerindo luz vinda do alto ou de aberturas elevadas.");
  if (F.greenShare > .06) obs.push("Há tons de verde que podem indicar plantas ou elementos naturais na composição.");
  if (F.woodShare > .12) obs.push("Tons amadeirados e terrosos aparecem com frequência, sugerindo materiais naturais.");
  const det = F.hotspots.find(h=>h.label==="detalhes");
  if (det) obs.push(`A região ${det.region} da foto concentra mais detalhes visuais.`);
  if (obs.length < 3) obs.push(t.contrast > 60 ? "Há bastante contraste entre áreas claras e escuras." : "As transições entre claro e escuro são suaves.");

  return {
    atmosphere: { summary: `Seu ambiente parece transmitir uma atmosfera ${listPt(atm.map(s=>s.toLowerCase()))}. Visualmente, percebemos um espaço ${light}, com ${temp} e ${color}.`, tags: atm },
    composition: `A composição apresenta ${dens}. ${env.em.charAt(0).toUpperCase()+env.em.slice(1)}, isso sugere ${t.complexity > 62 ? "um espaço vivido, construído a partir de diferentes referências" : t.complexity < 30 ? "uma preferência por ambientes mais objetivos e limpos" : "uma relação equilibrada entre o que se mostra e o que se guarda"}.`,
    lighting: t.brightness >= 60 ? "A sensação geral é de boa luminosidade. Vale observar se essa luz se mantém agradável à noite." : t.brightness >= 40 ? "A luminosidade é moderada. Uma iluminação complementar pode ajudar a criar diferentes cenas ao longo do dia." : "A imagem tem luz baixa. Pode ser uma escolha de atmosfera, ou uma oportunidade de melhorar a iluminação.",
    functionality: "No modo demonstração, não avaliamos circulação nem disposição dos móveis — apenas luz, cor e densidade visual. Uma análise com IA real pode observar esses pontos.",
    possible_experience: `Esse espaço parece favorecer ${experienceMap[envId]}.`,
    visual_observations: obs.slice(0,4),
    environment_check: { matches_selected: true, note: "" },
    image_quality: { usable: !F.quality.tooDark, note: F.quality.tooDark ? "A foto está bastante escura, então a leitura é limitada." : "" },
    traits: { ...t }
  };
}

/* ---------------------------------------------------------------------
   E. CAMADA DE SERVIÇO DE IA
   - live: envia a foto (redimensionada) + contexto ao backend configurado
     em config.js (a chave da IA fica apenas no servidor).
   - demo: usa a leitura local acima, sempre identificada como demonstração.
   Toda resposta passa por validação antes de chegar à interface.
   --------------------------------------------------------------------- */
const AIService = {
  mode: AI_MODE,
  async detect(){
    if (!CFG.aiEndpoint || location.protocol === "file:") return false;
    try {
      const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 8000);
      const res = await fetch(CFG.aiEndpoint, { method:"GET", signal:ctrl.signal, cache:"no-store" }); clearTimeout(tm);
      const j = res.ok ? await res.json() : null;
      if (j && j.ok && j.ai === true){ this.mode = "live"; return true; }
    } catch(e){ /* sem backend: segue em demonstração */ }
    return false;
  },
  async call(payload, timeoutMs=90000){
    const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(CFG.aiEndpoint, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload), signal:ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (!json || json.ok === false) throw new Error(json?.error || "Resposta inválida");
      return json.data;
    } finally { clearTimeout(tm); }
  },
  /* Etapa 04 — análise visual */
  async analyzeImage({ photo, env, features }){
    if (this.mode === "demo") return { source:"demo", data: demoInterpretation(features, env) };
    const [meta, b64] = photo.sendUrl.split(",");
    const data = await this.call({ task:"analyze", environment: env, image:{ media_type: meta.match(/data:(.*?);/)[1], data: b64 } });
    const valid = validateAnalysis(data);
    if (!valid) throw new Error("A IA retornou uma análise incompleta.");
    return { source:"ai", data: valid };
  },
  /* Etapa 08 — diagnóstico textual (a pontuação é sempre calculada localmente) */
  async diagnose(context){
    if (this.mode === "demo") return null;
    const data = await this.call({ task:"diagnose", context });
    return validateDiagnosis(data);
  }
};
function str(v, max=900){ return typeof v === "string" && v.trim() ? v.trim().slice(0,max) : null; }
function strArr(v, maxItems=6, max=320){ return Array.isArray(v) ? v.map(x=>str(x,max)).filter(Boolean).slice(0,maxItems) : []; }
function validateAnalysis(d){
  if (!d || typeof d !== "object") return null;
  const atmosphere = { summary: str(d.atmosphere?.summary), tags: strArr(d.atmosphere?.tags, 4, 40) };
  const out = {
    atmosphere,
    composition: str(d.composition), lighting: str(d.lighting), functionality: str(d.functionality),
    possible_experience: str(d.possible_experience), visual_observations: strArr(d.visual_observations, 5),
    environment_check: { matches_selected: d.environment_check?.matches_selected !== false, note: str(d.environment_check?.note, 300) || "" },
    image_quality: { usable: d.image_quality?.usable !== false, note: str(d.image_quality?.note, 300) || "" },
    traits: null
  };
  if (d.traits && typeof d.traits === "object"){
    const tr = {}; let ok = true;
    for (const k of ["brightness","warmth","colorfulness","complexity","naturalness"]){ const v = Number(d.traits[k]); if (!Number.isFinite(v)) ok = false; else tr[k] = clamp(Math.round(v),0,100); }
    if (ok) out.traits = tr;
  }
  if (!out.atmosphere.summary || !out.composition || !out.possible_experience) return null;
  if (!out.atmosphere.tags.length) out.atmosphere.tags = ["Em leitura"];
  return out;
}
function validateDiagnosis(d){
  if (!d || typeof d !== "object") return null;
  const recs = Array.isArray(d.recommendations) ? d.recommendations.map(r => ({
    level: [1,2,3].includes(Number(r?.level)) ? Number(r.level) : null,
    title: str(r?.title, 140), opportunity: str(r?.opportunity, 500), why: str(r?.why, 500), benefit: str(r?.benefit, 400)
  })).filter(r => r.level && r.title && r.opportunity && r.why && r.benefit).slice(0,12) : [];
  const out = { strengths: strArr(d.strengths, 6, 400), misalignments: strArr(d.misalignments, 6, 400), recommendations: recs, summary: str(d.summary, 600) };
  if (out.recommendations.length < 3 || !out.strengths.length) return null;
  return out;
}

/* ---------------------------------------------------------------------
   F. MÉTRICAS ANÔNIMAS + CONSENTIMENTO (LGPD)
   Nunca são enviadas: fotos, textos livres do questionário, dados pessoais.
   Comentário da avaliação: opcional, enviado apenas se o usuário escrever.
   --------------------------------------------------------------------- */
const EVENTS = ["page_view","journey_started","environment_selected","photo_uploaded","ai_analysis_completed","interpretation_reacted","questionnaire_completed","diagnosis_generated","report_viewed","experience_rated","instagram_clicked","journey_abandoned"];
const Metrics = {
  backend: (CFG.supabaseUrl && CFG.supabaseAnonKey) ? "supabase" : "local",
  sessionId: uid(),
  sent: new Set(),
  get consent(){ return store.get("sctr_consent", null); },          // "granted" | "denied" | null
  set consent(v){ store.set("sctr_consent", v); },
  visitorId(){ let v = store.get("sctr_vid"); if (!v){ v = uid(); store.set("sctr_vid", v); } return v; },
  newJourney(){ this.sessionId = uid(); this.sent = new Set(); },
  track(event, props={}, opts={}){
    if (!EVENTS.includes(event) || this.consent !== "granted") return;
    if (event !== "page_view" && !opts.repeat){ if (this.sent.has(event)) return; this.sent.add(event); }
    const row = { event, session_id:this.sessionId, visitor_id:this.visitorId(), environment:S.env || null, step:S.screen, props, client_ts:new Date().toISOString() };
    if (this.backend === "supabase") this.sendSupabase("events", row, opts.beacon);
    else { const arr = store.get("sctr_local_events", []); arr.push({ ...row, created_at:row.client_ts }); store.set("sctr_local_events", arr.slice(-3000)); }
  },
  feedback(rating, comment){
    if (this.consent !== "granted" || !comment) return;
    const row = { session_id:this.sessionId, rating, comment: comment.slice(0,500) };
    if (this.backend === "supabase") this.sendSupabase("feedback", row);
    else { const arr = store.get("sctr_local_feedback", []); arr.push({ ...row, created_at:new Date().toISOString() }); store.set("sctr_local_feedback", arr.slice(-500)); }
  },
  sendSupabase(table, row, keepalive=false){
    fetch(`${CFG.supabaseUrl.replace(/\/$/,"")}/rest/v1/${table}`, {
      method:"POST", keepalive,
      headers:{ apikey:CFG.supabaseAnonKey, Authorization:`Bearer ${CFG.supabaseAnonKey}`, "Content-Type":"application/json", Prefer:"return=minimal" },
      body: JSON.stringify(row)
    }).catch(()=>{ /* métricas nunca bloqueiam a experiência */ });
  }
};

function getOpts(q){ return typeof q.opts === "function" ? q.opts() : (q.opts || []); }

/* Sequência atual — recalculada a cada passo (conserva o que já foi respondido) */
function buildSequence(){
  const seq = []; let conds = 0;
  for (const q of QUESTIONS){
    if (q.env && q.env !== S.env) continue;
    if (q.cond){ if (conds >= 2 || !q.when()) continue; conds++; }
    seq.push(q);
  }
  return seq;
}
function isAnswered(q){
  const v = S.answers[q.id];
  if (q.type === "multi" || q.type === "image") return Array.isArray(v) && v.length >= (q.min||1);
  if (q.type === "scale") return Number.isInteger(v);
  if (q.type === "single+text") return !!(v && v.choice) && (v.choice !== "outro" || (v.text||"").trim().length >= 3);
  return !!v;
}
function answerLabel(q){
  const v = S.answers[q.id]; if (v == null) return "—";
  if (q.type === "scale") return `${v} de 5 · ${["Pouca","Baixa","Média","Alta","Essencial"][v-1]}`;
  const opts = getOpts(q), lab = id => opts.find(o=>o.id===id)?.label || id;
  if (Array.isArray(v)) return v.map(lab).join(", ");
  if (q.type === "single+text") return lab(v.choice) + (v.text ? ` — “${v.text}”` : "");
  return lab(v);
}

const BANDS = [
