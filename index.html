const bandOf = v => BANDS.find(b => v >= b.min && v <= b.max) || BANDS[0];

function traitFit(targets, t){
  const ks = Object.keys(targets).filter(k => t[k] != null); if (!ks.length) return null;
  const dev = ks.reduce((s,k)=> s + Math.abs(t[k] - targets[k]), 0) / ks.length;
  return clamp(100 - dev * 1.25, 0, 100);
}
function computeScores(){
  const seq = buildSequence(), t = T(), contrib = [];
  const R = REACTIONS[S.reaction] || REACTIONS.partes;
  const sc = { ...R.base };
  const add = (fx, label) => { for (const k in fx){ if (!fx[k]) continue; sc[k] += fx[k]; contrib.push({ dim:k, label, value:fx[k] }); } };
  DIMS.forEach(d => contrib.push({ dim:d.key, label:`Base pela sua reação: “${R.title}”`, value:R.base[d.key], base:true }));

  // Follow-up da reação
  const fu = FOLLOWUPS[S.reaction];
  (S.followup[S.reaction]||[]).forEach(id => { const o = fu.opts.find(x=>x.id===id); if (o?.fx) add(o.fx, `${S.reaction==="sim"?"Gostaria de melhorar":"Ainda não representado"}: ${o.label}`); });

  // Respostas com efeitos diretos
  seq.forEach(q => {
    const v = S.answers[q.id]; if (v == null) return;
    const opts = getOpts(q);
    const ids = Array.isArray(v) ? v : [q.type==="single+text" ? v.choice : v];
    ids.forEach(id => { const o = opts.find(x=>x.id===id); if (o?.fx) add(o.fx, `${q.short}: ${o.label}`); });
  });

  // Regras cruzadas foto × respostas (explícitas)
  if (ans("organizacao")==="tudo_no_lugar" && t.complexity > 60) add({ f:-8 }, "Preferência por tudo no lugar × muitos elementos visíveis na foto");
  if (ans("organizacao")==="tudo_no_lugar" && t.complexity < 30) add({ f:5, a:3 }, "Preferência por organização × composição limpa na foto");
  if (["espontaneo","desordem_ok"].includes(ans("organizacao")) && t.complexity > 60) add({ a:4 }, "Gosto por espontaneidade × composição cheia de camadas");
  const q_s = ans("q_silencio"); if (seq.some(q=>q.id==="q_silencio") && q_s >= 4 && ["pouco","nao"].includes(ans("q_descanso"))) add({ c:-4, p:-3 }, "Silêncio essencial × descanso comprometido");
  const cl = ans("c_luz");
  if (seq.some(q=>q.id==="c_luz")){
    if (cl==="quente" && t.warmth < 45) add({ c:-6 }, "Deseja luz quente × foto com tons frios");
    if (cl==="quente" && t.warmth >= 58) add({ c:4 }, "Deseja luz quente × foto com tons quentes");
    if (cl==="clara" && t.brightness < 45) add({ c:-6 }, "Deseja luz clara × foto com pouca luz");
    if (cl==="natural" && t.brightness >= 62) add({ c:4 }, "Valoriza luz natural × foto luminosa");
  }

  // Identidade estética: aderência entre referências escolhidas e a foto
  const refTargets = {}; (ans("refs")||[]).forEach(id => Object.assign(refTargets, ...Object.entries(REF_TARGETS[id]||{}).map(([k,v])=>({ [k]: refTargets[k]!=null ? (refTargets[k]+v)/2 : v }))));
  if (S.reaction === "nao") (S.followup.nao||[]).forEach(id => Object.entries(DESIRED_TRAITS[id]||{}).forEach(([k,v]) => { refTargets[k] = refTargets[k]!=null ? (refTargets[k]+v)/2 : v; }));
  const aFit = traitFit(refTargets, t);
  if (aFit != null){ const delta = Math.round((aFit - 60) * .45); add({ a:delta }, `Aderência entre suas referências visuais e a foto (${Math.round(aFit)}%)`); }

  // Conforto e atmosfera: sensação desejada × atmosfera medida na foto
  const cFit = traitFit(SENSATION_TARGETS[ans("sensacao")]||{}, t);
  if (cFit != null){ const delta = Math.round((cFit - 60) * .4); add({ c:delta }, `Sensação desejada × atmosfera da foto (${Math.round(cFit)}%)`); }

  // Prioridades: quantidade de transformações desejadas
  const np = (ans("prioridades")||[]).length;
  if (np > 1) add({ p: -(np-1)*4 }, `${np} prioridades de transformação escolhidas`);
  if ((ans("incomodo")?.text||"").trim().length > 20) add({ p:-2 }, "Incômodo descrito com detalhes");

  const out = {}; DIMS.forEach(d => out[d.key] = Math.round(clamp(sc[d.key], 8, 97)));
  const overall = Math.round(DIMS.reduce((s,d)=> s + out[d.key]*d.weight, 0));
  return { dims:out, overall, band:bandOf(overall), contrib, aFit, cFit };
}

function detectNeeds(scores){

  const fu = FOLLOWUPS[S.reaction]; (S.followup[S.reaction]||[]).forEach(id => { const o = fu?.opts.find(x=>x.id===id); if (o?.need) add(o.need, 2, S.reaction==="sim" ? `Mesmo gostando do ambiente, você quer: ${lower1(o.label)}.` : `Você sente que falta ${lower1(o.label)} no ambiente.`); });
  if (S.reaction==="nao" && S.followup.nao.length) add("personalidade", 2, `Você gostaria que a casa fosse percebida como ${listPt(S.followup.nao.map(x=>x.toLowerCase()))}.`);
  // respostas com necessidade direta
  buildSequence().forEach(q => { const v = S.answers[q.id]; if (v == null || q.id==="incomodo") return; const ids = Array.isArray(v) ? v : [v]; ids.forEach(id => { const o = getOpts(q).find(x=>x.id===id); if (o?.need) add(o.need, 3, `${q.short}: você respondeu “${o.label}”.`); }); });

  const refs = ans("refs")||[];
  if (refs.includes("clara") && t.brightness < 48) add("iluminacao", 3, "Você se identificou com ambientes claros, e a foto mostra luminosidade mais baixa.");
  if (refs.includes("escura") && t.brightness > 68) add("iluminacao", 2, "Você se atrai por atmosferas intimistas, e a foto mostra um ambiente bastante claro — luz baixa e pontual pode criar essa cena à noite.");
  if (refs.includes("natural") && t.naturalness < 32) add("materiais", 3, "Você escolheu materiais naturais, e a foto mostra poucos tons de madeira ou verde.");
  if (refs.includes("minimal") && t.complexity > 58) add("organizacao", 3, "Você se identificou com poucos elementos, e a foto mostra muitas camadas visuais.");
  if (refs.includes("camadas") && t.complexity < 32) add("personalidade", 3, "Você gosta de ambientes cheios de camadas, e a foto mostra uma composição bem enxuta.");
  if (refs.includes("marcante") && t.colorfulness < 30) add("cor", 3, "Você se atrai por cores marcantes, e a paleta da foto é contida.");
  if (refs.includes("neutra") && t.colorfulness > 58) add("cor", 2, "Você prefere paletas neutras, e a foto tem cores intensas competindo entre si.");
  if (ans("sensacao")==="tranquilidade" && t.complexity > 60) add("organizacao", 2, "Você busca tranquilidade, e a foto sugere bastante estímulo visual.");
  if (ans("sensacao")==="acolhimento" && t.warmth < 45) add("conforto", 2, "Você busca acolhimento, e a foto mostra tons mais frios.");
  if (ans("sensacao")==="energia" && t.colorfulness < 30) add("cor", 2, "Você busca energia, e a paleta da foto é bastante contida.");
  if (ans("sensacao")==="liberdade" && t.complexity > 60) add("espaco", 2, "Você busca liberdade, e a foto mostra o ambiente bem preenchido.");
  if (ans("q_silencio") >= 4) add("privacidade", 2, "O silêncio e a privacidade são muito importantes para você.");
  if (ans("c_luz")==="quente" && t.warmth < 50) add("iluminacao", 2, "Você quer luz quente no fim do dia, e a foto tem temperatura de cor mais fria.");
  // dimensões baixas
  const dimNeed = { f:"funcionalidade", a:"estetica", c:"conforto", p:"espaco" };
  DIMS.forEach(d => { if (scores.dims[d.key] < 55) add(dimNeed[d.key], 1, `${d.name} ficou em ${scores.dims[d.key]}% no seu termômetro.`); });

}
function buildRecommendations(needs){
  const plan = [[1,2,3],[1,3],[2],[1],[3],[2]];
  const recs = [];
  needs.slice(0,6).forEach((n, i) => (plan[i]||[]).forEach(lv => {
    const L = REC_LIB[n.key][lv];
    recs.push({ level:lv, need:n.key, title:L.t, opportunity:L.o.replace("{amb}", AMB[S.env]||"no ambiente"), why:n.ev.slice(0,2).join(" "), benefit:L.b, complexity:LV[lv].cx });
  }));
  if (recs.length < 4){ ["funcionalidade","conforto"].forEach(k => [1,2].forEach(lv => { if (!recs.some(r=>r.need===k && r.level===lv)) { const L = REC_LIB[k][lv]; recs.push({ level:lv, need:k, title:L.t, opportunity:L.o.replace("{amb}",AMB[S.env]), why:"Sugestão para reforçar o que já funciona no seu dia a dia.", benefit:L.b, complexity:LV[lv].cx }); } })); }
  return recs;
}
function buildStrengths(scores){
  const t = T(), out = [], refs = ans("refs")||[];
  const push = (title, text) => out.push({ title, text });
  if (refs.includes("clara") && t.brightness >= 60) push("A luz já está do seu lado", "A luminosidade da foto conversa com sua preferência por ambientes claros — vale preservar as aberturas e superfícies claras.");
  if (refs.includes("escura") && t.brightness < 45) push("Atmosfera intimista", "A luz mais baixa da foto combina com o clima intimista que você escolheu.");
  if (refs.includes("natural") && t.naturalness >= 40) push("Materiais com alma", "Os tons de madeira e verde da foto já dialogam com sua atração por materiais naturais.");
  if (refs.includes("minimal") && t.complexity < 40) push("Respiro visual", "A composição enxuta da foto já acompanha seu gosto por poucos elementos.");
  if (refs.includes("camadas") && t.complexity >= 55) push("Camadas de história", "A quantidade de objetos e texturas na foto combina com seu gosto por ambientes cheios de referências.");
  if (refs.includes("neutra") && t.colorfulness < 40) push("Paleta serena", "A paleta contida da foto está alinhada à sua preferência por tons neutros.");
  if (refs.includes("marcante") && t.colorfulness >= 52) push("Cor com personalidade", "As cores marcantes da foto já traduzem sua preferência por contrastes.");
  if (scores.cFit != null && scores.cFit >= 70) push("A sensação certa", `A atmosfera da foto se aproxima da ${({tranquilidade:"tranquilidade",acolhimento:"sensação de acolhimento",energia:"energia",liberdade:"sensação de liberdade",sofisticacao:"sofisticação",criatividade:"criatividade"})[ans("sensacao")]||"sensação"} que você quer encontrar ao chegar em casa.`);
  if (S.reaction === "sim") push("Você se reconhece no espaço", "Você confirmou que o ambiente transmite o que gosta. Essa identificação é a base de tudo.");
  if (S.reaction === "partes") push("Uma base para construir", "Você reconheceu partes de si no ambiente — é a partir delas que as mudanças devem nascer.");
  if (ans("q_descanso")==="sim") push("Descanso garantido", "Você sente que o quarto proporciona descanso — um ponto que deve ser protegido em qualquer mudança.");
  if (ans("s_acomoda")==="sim") push("Pronta para receber", "A sala acomoda bem as pessoas que você recebe.");
  if (ans("k_armazen")==="nao" || ans("c_lugar")==="todos") push("Tudo tem lugar", "O armazenamento atual já atende sua rotina.");
  if (ans("k_bancada")==="sim") push("Bancada generosa", "Há espaço para preparar e conviver ao mesmo tempo.");
  DIMS.forEach(d => { if (scores.dims[d.key] >= 76 && out.length < 6) push(`${d.short} em alta`, `${d.name} chegou a ${scores.dims[d.key]}% no seu termômetro.`); });
  const names = [...new Set((S.features?.palette||[]).slice(0,2).map(p=>p.name))];
  if (out.length < 2 && names.length) push("Uma paleta reconhecível", `A combinação de ${listPt(names)} dá ao ambiente uma identidade visual própria.`);
  if (out.length < 2) push("Um ponto de partida claro", "Suas respostas mostram com nitidez o que você valoriza — isso torna qualquer transformação mais certeira.");
  return out.slice(0,5);
}
function buildMisalignments(needs){
  return needs.slice(0,5).map(n => ({ title: NEED_NAMES[n.key], text: n.ev[0] ? n.ev[0].replace(/^Você escolheu/, "Você destacou") : "" })).filter(m=>m.text);
}
const PROFILES = {
  tranquilidade:{ title:"Refúgio sereno", text:"Para você, a casa é um lugar de pausa. Calma visual, luz suave e poucos estímulos fazem diferença." },
  acolhimento:{ title:"Ninho afetivo", text:"Você quer ser abraçado(a) pelo espaço: texturas, calor, memórias e conforto vêm antes de tudo." },
  energia:{ title:"Casa em movimento", text:"Você se alimenta de vida e cor. O ambiente precisa acompanhar seu ritmo e te dar ânimo." },
  liberdade:{ title:"Espaço que respira", text:"Você valoriza amplitude e leveza. Menos barreiras, mais fluidez e liberdade de uso." },
  sofisticacao:{ title:"Curadoria elegante", text:"Você aprecia escolhas cuidadosas: cada peça e cada material precisam ter razão de estar ali." },
  criatividade:{ title:"Ateliê de ideias", text:"Sua casa é fonte de inspiração. Referências, cor e espaço para criar fazem parte de quem você é." }
};
const SOCIAL_TXT = { receber:"Gosta de receber pessoas", individual:"Aproveita a casa individualmente", alternar:"Alterna momentos sociais e individuais", dinamica:"Tem uma rotina muito dinâmica" };
const ORG_TXT = { tudo_no_lugar:"Gosta de tudo no lugar", flexivel:"Organização sem rigidez", espontaneo:"Prefere ambientes espontâneos", desordem_ok:"Convive bem com alguma desordem" };

function generateDiagnosis(){
  const scores = computeScores();
  const needs = detectNeeds(scores);
  const profile = PROFILES[ans("sensacao")] || PROFILES.acolhimento;
  return {
    scores, needs, profile,
    traitsList: [ SOCIAL_TXT[ans("social")], ORG_TXT[ans("organizacao")] ].filter(Boolean),
    strengths: buildStrengths(scores),
    misalignments: buildMisalignments(needs),
    recommendations: buildRecommendations(needs),
    source: "rules",
    createdAt: new Date()
  };
}
/* Contexto estruturado enviado à IA real (sem texto livre além do incômodo, que o próprio usuário escreveu para a análise) */
function diagnosisContext(local){
  const seq = buildSequence();
  return {
    environment: S.env, visual_analysis: S.analysis, user_reaction: S.reaction,
    reaction_followup: S.followup[S.reaction],
    answers: seq.map(q => ({ question: q.title, block: BLOCKS[q.block].name, answer: answerLabel(q) })),
    compatibility_dimensions: Object.fromEntries(DIMS.map(d=>[d.name, local.scores.dims[d.key]])),
    compatibility_score: local.scores.overall, band: local.scores.band.name,
    detected_needs: local.needs.slice(0,6).map(n => ({ need: NEED_NAMES[n.key], evidence: n.ev }))
  };
}

/* ETAPA 07 — QUESTIONÁRIO ADAPTATIVO */
quiz(){
  const seq = buildSequence(); S.qIndex = clamp(S.qIndex, 0, seq.length-1);

  const v = S.answers[q.id], opts = getOpts(q);

    <div class="quiz-top"><span class="block-tag"><b>${q.block}</b>${BLOCKS[q.block].name}</span><span class="q-count">Pergunta ${S.qIndex+1} de ${seq.length}</span></div>

    ${body}

report(){

  return `<section class="screen"><div class="wrap">

      <footer class="doc-foot"><span>Estimativa de compatibilidade entre o espaço e as necessidades declaradas — não é uma avaliação técnica do imóvel.</span><span>Desenvolvido pelo LED Arquitetura</span></footer>

        <a class="btn light" href="${esc(CFG.instagramUrl)}" target="_blank" rel="noopener noreferrer" data-action="instagram">Conheça o LED Arquitetura<span class="arrow">${icon("instagram",2)}</span></a></div>
      <div class="vis" aria-hidden="true">${patternBand(P.viva, P.urb, 300)}</div>
    </section>
  </div></section>`;
}
};

/* --- Componentes gráficos --- */
function miniGauge(v){
  const c = 2*Math.PI*16;
  return `<svg class="mini-gauge" viewBox="0 0 42 42"><circle cx="21" cy="21" r="16" fill="none" stroke="#EFE9CF" stroke-width="6"/><circle cx="21" cy="21" r="16" fill="none" stroke="#9CAA39" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 21 21)"/></svg>`;
}
function arcPath(cx, cy, r, a0, a1){
  const p = a => [cx + r*Math.cos(a*Math.PI/180), cy + r*Math.sin(a*Math.PI/180)];
  const [x0,y0] = p(a0), [x1,y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function gaugeSVG(){
  const A0 = 135, SPAN = 270, ang = v => A0 + SPAN*v/100;
  const segs = BANDS.map(b => `<path d="${arcPath(150,150,128,ang(b.min)+1,ang(b.max+1)-1)}" stroke="${b.color}" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>`).join("");
  const ticks = [0,40,60,80,100].map(v => { const a = ang(v)*Math.PI/180; return `<text x="${(150+146*Math.cos(a)).toFixed(1)}" y="${(150+146*Math.sin(a)+4).toFixed(1)}" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#E3D9AC" opacity=".7">${v}</text>`; }).join("");
  return `<svg viewBox="0 0 300 270" role="img" aria-label="Medidor de conexão"><path d="${arcPath(150,150,110,A0,A0+SPAN)}" stroke="rgba(227,217,172,.16)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path id="gaugeArc" d="${arcPath(150,150,110,A0,A0+SPAN)}" stroke="${S.diagnosis.scores.band.color}" stroke-width="22" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset 2s cubic-bezier(.2,.8,.2,1)"/>
    ${segs}${ticks}<circle id="gaugeDot" cx="0" cy="0" r="9" fill="#F4F0E6" opacity="0"/></svg>`;
}
function ringSVG(v, color){
  const c = 2*Math.PI*60;
  return `<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${v}% de conexão"><circle cx="75" cy="75" r="60" fill="none" stroke="#EFE9CF" stroke-width="16"/><circle cx="75" cy="75" r="60" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="84" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="700" font-size="32" fill="#1F2433">${v}%</text></svg>`;
}
function sealSVG(){
  return `<svg class="seal" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="none" stroke="#E9B349" stroke-width="1.5" stroke-dasharray="3 5"/><path d="M18 82V48a30 30 0 0 1 60 0v34z" fill="#E9B349"/><path d="M32 82V52a16 16 0 0 1 32 0v30z" fill="#3E162F"/><circle cx="48" cy="44" r="5" fill="#9CAA39"/></svg>`;
}
const RATE_MSG = ["","Vamos trabalhar para melhorar!","Obrigado pela sinceridade!","Que bom que você participou!","Ficamos felizes que tenha gostado!","Que incrível! Ficamos muito felizes!"];
function starSVG(){ return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" stroke-linejoin="round"/></svg>`; }
function rateInner(){
  if (S.ratingSent) return `<div class="done"><span class="ok">${icon("check",2.6)}</span><h3>Obrigado por compartilhar sua experiência!</h3>${Metrics.consent!=="granted"?`<p class="fine">Como as métricas estão desativadas nas suas preferências, sua avaliação não foi registrada.</p>`:""}</div>`;
  const r = S.rating||0;
  return `<span class="eyebrow">Avaliação opcional</span><h3>E aí, o que você achou dessa experiência?</h3><p>Sua opinião nos ajuda a criar experiências cada vez melhores.</p>
    <div class="stars" role="radiogroup" aria-label="Avaliação de 1 a 5 estrelas">${[1,2,3,4,5].map(n=>`<button class="star ${n<=r?"lit":""}" role="radio" aria-checked="${r===n}" aria-label="${n} estrela${n>1?"s":""}" data-action="star" data-id="${n}">${starSVG()}</button>`).join("")}</div>
    <p class="rate-msg" id="rateMsg">${r ? RATE_MSG[r] : ""}</p>
    <textarea id="rateComment" maxlength="500" placeholder="Quer deixar alguma sugestão ou contar o que mais gostou?" aria-label="Comentário opcional">${esc(S.ratingComment)}</textarea>
    <p class="fine">Comentário opcional e anônimo — evite incluir dados pessoais.</p>
    <div style="margin-top:18px;display:flex;justify-content:center">${nextBtn("Enviar avaliação","rate-send",!r,"solo")}</div>`;
}
</script>
<script>
"use strict";
/* ---------------------------------------------------------------------
   K. NAVEGAÇÃO, EVENTOS E INICIALIZAÇÃO
   --------------------------------------------------------------------- */
const PREV = { env:"intro", upload:"env", reading:"upload", reaction:"reading", quiz:"reaction", result:"quiz", book:"result", report:"book" };

function render(){
  const st = stage();
  st.innerHTML = (VIEWS[S.screen] || VIEWS.intro)();
  document.body.classList.toggle("has-dock", !!$(".actions.dock", st));
  updateHeader();
  afterRender();
}
function go(screen, { push=true, scroll=true } = {}){
  S.screen = screen;
  S.maxReached = Math.max(S.maxReached, SCREENS.indexOf(screen));
  if (push) history.pushState({ screen, q:S.qIndex }, "", screen==="intro" ? location.pathname : "#" + screen);
  render();
  if (scroll) window.scrollTo(0,0);
  stage().focus({ preventScroll:true });
}
window.addEventListener("popstate", e => {
  const st = e.state;
  if (!st || !st.screen){ S.screen = "intro"; render(); return; }
  // bloqueia saltos para etapas ainda não liberadas
  if (!canEnter(st.screen)){ history.replaceState({ screen:S.screen, q:S.qIndex }, ""); return; }
  S.screen = st.screen; if (st.screen === "quiz" && Number.isInteger(st.q)) S.qIndex = st.q;
  // telas transitórias não são reabertas pelo histórico
  if (S.screen === "analyzing" && !S._analyzing) S.screen = S.analysis ? "reading" : "upload";
  if (S.screen === "crossing" && !S._crossing) S.screen = S.diagnosis ? "result" : "quiz";
  render(); window.scrollTo(0,0);
});
function canEnter(sc){
  switch (sc){
    case "intro": case "env": return true;
    case "upload": return !!S.env;
    case "analyzing": case "reading": return !!S.analysis || !!S.photo;
    case "reaction": return !!S.analysis;
    case "quiz": return !!S.reaction;
    case "crossing": case "result": case "book": case "report": return !!S.diagnosis;
  }
  return false;
}

/* Cabeçalho: fases, progresso e conquistas */
function updateHeader(){
  const idx = PHASES.findIndex(p => p.screens.includes(S.screen));
  $("#phases").innerHTML = PHASES.map((p,i)=>`<div class="phase ${i<idx?"done":i===idx?"current":""}" ${i===idx?'aria-current="step"':""}><i>${i<idx?"✓":i+1}</i><span>${p.name}</span></div>`).join("");
  let pct = SCREENS.indexOf(S.screen) / (SCREENS.length-1);
  if (S.screen === "quiz"){ const n = buildSequence().length; pct = (6 + S.qIndex/n) / (SCREENS.length-1); }
  $("#progressLine").style.width = Math.round(pct*100) + "%";
  const n = Object.keys(S.stamps).length;
  $("#stamps .dots").innerHTML = STAMPS.map(s=>`<b class="${S.stamps[s.id]?"on":""}"></b>`).join("");
  $("#stamps").title = `${n} de ${STAMPS.length} descobertas`;
  $("#stamps").setAttribute("aria-label", `${n} de ${STAMPS.length} descobertas conquistadas`);
  $("#demoFlag").hidden = AIService.mode !== "demo" || S.screen === "intro";
}
let toastTimer;
function toast(title, sub="", n=null){
  const el = $("#toast");
  el.innerHTML = `${n ? medalSVG(n) : `<svg class="medal" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#E9B349"/><path d="M20 10l2.6 6 6.4.6-4.8 4.3 1.4 6.3L20 24l-5.6 3.2 1.4-6.3L11 16.6l6.4-.6z" fill="#283145"/></svg>`}<span><small>${esc(sub)}</small><b>${esc(title)}</b></span>`;
  el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 3400);
}
function award(id){
  if (S.stamps[id]) return; S.stamps[id] = true;
  const i = STAMPS.findIndex(s=>s.id===id), s = STAMPS[i];
  toast(s.title, `Descoberta ${i+1} de ${STAMPS.length}`, i+1); updateHeader();
}

/* Pós-renderização: animações e fluxos assíncronos */
function afterRender(){
  const sc = S.screen;
  if (sc === "upload") bindDropzone();
  if (sc === "analyzing" && !S._analyzing) runAnalysis();
  if (sc === "crossing" && !S._crossing) runCrossing();
  if (sc === "result") animateResult();
  if (["book","result","report"].includes(sc)) observeReveal();
  if (sc === "quiz") bindQuizText();
  if (sc === "report"){ award("report"); Metrics.track("report_viewed", { score:S.diagnosis.scores.overall }); bindRating(); }
}
function observeReveal(){
  const els = $$(".reveal");
  if (!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.15 });
  els.forEach(e => io.observe(e));
}

/* --- Upload --- */
function bindDropzone(){
  const dz = $("#dropzone"); if (!dz) return;
  ["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("drag"); }));
  dz.addEventListener("drop", e => { const f = e.dataTransfer.files?.[0]; if (f) handleFile(f); });
}
function showUploadError(msg){ const el = $("#uploadError"); if (el) el.innerHTML = `<div class="alert" role="alert">${icon("alert")}<span>${esc(msg)}</span></div>`; }
async function handleFile(file){
  const err = validateFile(file); if (err) return showUploadError(err);
  try {
    const { img, url } = await readImage(file);
    if (Math.min(img.naturalWidth, img.naturalHeight) < 320){ URL.revokeObjectURL(url); return showUploadError("A resolução da foto é muito baixa (mínimo de 320 px no menor lado). Tente outra imagem."); }
    if (S.photo?.url) URL.revokeObjectURL(S.photo.url);
    S.features = analyzeImageLocal(img);
    S.photo = { url, sendUrl: drawScaled(img, 1568, .85).dataUrl(), name:file.name || "foto.jpg", w:img.naturalWidth, h:img.naturalHeight, size:file.size };
    resetFromAnalysis();
    render();
  } catch(e){ showUploadError("Não conseguimos abrir esta imagem. Ela pode estar corrompida ou em um formato não suportado. Tente outra foto em JPG, PNG ou WEBP."); }
}
function resetFromAnalysis(){ S.analysis = null; S.analysisSource = null; S.traits = null; S.reaction = null; S.followup = { sim:[], partes:[], nao:[] }; S.diagnosis = null; S.dirty = true; S.maxReached = Math.min(S.maxReached, SCREENS.indexOf("upload")); }
["#fileGallery","#fileCamera"].forEach(sel => $(sel).addEventListener("change", e => { const f = e.target.files?.[0]; e.target.value = ""; if (f) handleFile(f); }));

/* --- Etapa 04: análise --- */
async function runAnalysis(){
  S._analyzing = true;
  const steps = $$("#procSteps li"), t0 = performance.now(), minMs = AIService.mode==="demo" ? 4200 : 2500;
  let k = 0; const setStep = i => steps.forEach((li,j)=>{ li.classList.toggle("done", j<i); li.classList.toggle("active", j===i); });
  setStep(0);
  const timer = setInterval(()=>{ if (k < steps.length-2){ k++; setStep(k); } }, 1100);
  // pontos de atenção medidos na foto
  const pins = $("#pins");
  (S.features?.hotspots||[]).forEach((h,i)=> setTimeout(()=>{ if (pins) pins.insertAdjacentHTML("beforeend", `<span class="pin" style="left:${h.x}%;top:${h.y}%"><i></i><span>${h.label}</span></span>`); }, 700 + i*900));
  try {
    const res = await AIService.analyzeImage({ photo:S.photo, env:S.env, features:S.features });
    const wait = minMs - (performance.now()-t0); if (wait > 0) await sleep(wait);
    clearInterval(timer); setStep(steps.length-1); await sleep(500); setStep(steps.length);
    S.analysis = res.data; S.analysisSource = res.source;
    S.traits = { ...S.features.traits, ...(res.data.traits||{}) };
    await sleep(450);
    S._analyzing = false;
    Metrics.track("ai_analysis_completed", { source:res.source });
    go("reading", { push:false }); history.replaceState({ screen:"reading" }, "", "#reading");
  } catch(e){
    clearInterval(timer); S._analyzing = false;
    const el = $("#procError");
    if (el) el.innerHTML = `<div class="alert" role="alert">${icon("alert")}<span>Não foi possível concluir a análise com IA agora (${esc(e.name==="AbortError"?"tempo esgotado":e.message||"falha de conexão")}). Você pode tentar novamente, trocar a foto ou seguir com uma leitura de demonstração — claramente identificada como tal.</span></div>
      <div class="actions" style="flex-wrap:wrap"><button class="btn-ghost" data-action="retry-analysis">${icon("restart")} Tentar novamente</button><button class="btn-ghost" data-action="demo-analysis">${icon("eye")} Seguir com leitura de demonstração</button><button class="btn-ghost" data-action="back-upload">${icon("swap")} Trocar foto</button></div>`;
  }
}

/* --- Etapa 08: cruzamento --- */
async function runCrossing(){
  S._crossing = true;
  const msgs = ["Comparando a foto com suas respostas...","Medindo funcionalidade, identidade, conforto e prioridades...","Encontrando seus pontos de conexão...","Selecionando sugestões para você..."];
  let i = 0; const el = () => $("#crossMsg");
  const timer = setInterval(()=>{ i = (i+1) % msgs.length; if (el()) el().textContent = msgs[i]; }, 1100);
  const t0 = performance.now();
  const D = generateDiagnosis();   // pontuação sempre local e explícita
  if (AIService.mode === "live"){
    try {
      const ai = await AIService.diagnose(diagnosisContext(D));
      if (ai){
        D.strengths = ai.strengths.map(t=>({ title:"", text:t }));
        if (ai.misalignments.length) D.misalignments = ai.misalignments.map(t=>({ title:"", text:t }));
        D.recommendations = ai.recommendations.map(r => ({ ...r, need:null, complexity:LV[r.level].cx }));
        D.summary = ai.summary; D.source = "ai";
      }
    } catch(e){ /* mantém o diagnóstico por regras, que já é personalizado */ }
  }
  const wait = 3600 - (performance.now()-t0); if (wait > 0) await sleep(wait);
  clearInterval(timer);
  S.diagnosis = D; S.dirty = false; S._crossing = false;
  Metrics.track("diagnosis_generated", {
    score:D.scores.overall, band:D.scores.band.name, dims:D.scores.dims, reaction:S.reaction,
    priorities: ans("prioridades")||[], needs: D.needs.slice(0,5).map(n=>n.key), source:D.source
  }, { repeat:true });
  go("result", { push:false }); history.replaceState({ screen:"result" }, "", "#result");
}

/* --- Etapa 09: animação do termômetro --- */
function animateResult(){
  const D = S.diagnosis, v = D.scores.overall;
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    const arc = $("#gaugeArc"); if (arc) arc.style.strokeDashoffset = 100 - v;
    const num = $("#gaugeNum"), t0 = performance.now(), dur = 2000;
    const step = now => { const p = Math.min(1,(now-t0)/dur), e = 1 - Math.pow(1-p,3); if (num) num.textContent = Math.round(v*e); if (p<1) requestAnimationFrame(step); else { $("#bandPill")?.classList.add("show"); } };
    requestAnimationFrame(step);
    $$(".dim .track span[data-w]").forEach((s,i)=> setTimeout(()=>{ s.style.width = s.dataset.w + "%"; }, 600 + i*250));
  }));
  setTimeout(()=> award("result"), 2300);
}

/* --- Questionário: texto livre e seleção --- */
function bindQuizText(){
  const ta = $("#freeText"); if (!ta) return;
  ta.addEventListener("input", () => {
    const v = S.answers.incomodo || (S.answers.incomodo = { choice:null, text:"" });
    v.text = ta.value.slice(0,280); S.dirty = true; $("#freeCount").textContent = v.text.length;
    const q = buildSequence()[S.qIndex]; $('[data-action="quiz-next"]').disabled = !isAnswered(q);
  });
}
function answerQuestion(id){
  const seq = buildSequence(), q = seq[S.qIndex]; S.dirty = true;
  if (q.type === "single"){
    S.answers[q.id] = id; render();
    setTimeout(()=>{ if (S.screen==="quiz" && buildSequence()[S.qIndex]?.id===q.id) quizNext(); }, 420);
    return;
  }
  if (q.type === "scale"){ S.answers[q.id] = Number(id); render(); setTimeout(()=>{ if (S.screen==="quiz" && buildSequence()[S.qIndex]?.id===q.id) quizNext(); }, 420); return; }
  if (q.type === "single+text"){ const cur = S.answers[q.id] || { choice:null, text:"" }; cur.choice = id; S.answers[q.id] = cur; render(); if (id==="outro") $("#freeText")?.focus(); return; }
  // multi / image
  const arr = S.answers[q.id] ? [...S.answers[q.id]] : [];
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i,1);
  else if (arr.length >= q.max){ const n = $("#limitNote"); if (n){ n.textContent = `Você pode escolher até ${q.max}. Desmarque uma opção para trocar.`; n.classList.add("warn"); } return; }
  else arr.push(id);
  S.answers[q.id] = arr;
  // atualização leve, sem reconstruir a tela (mantém rolagem)
  $$('[data-action="answer"]').forEach(b => b.setAttribute("aria-pressed", arr.includes(b.dataset.id)));
  const n = $("#limitNote"); if (n){ n.textContent = `${arr.length}/${q.max} selecionadas`; n.classList.remove("warn"); }
  $('[data-action="quiz-next"]').disabled = !isAnswered(q);
}
const BLOCK_TOASTS = { B:"Estamos conhecendo melhor sua maneira de viver.", C:"Sua rotina já está no mapa.", D:"Sua identidade está ficando mais clara.", E:"Estamos chegando ao resultado!" };
function quizNext(){
  const seq = buildSequence(), q = seq[S.qIndex]; if (!isAnswered(q)) return;
  if (S.qIndex < seq.length-1){
    const nq = seq[S.qIndex+1]; S.qIndex++;
    if (nq.block !== q.block && BLOCK_TOASTS[nq.block]) toast(BLOCK_TOASTS[nq.block], `Bloco ${nq.block} · ${BLOCKS[nq.block].name}`);
    go("quiz");
  } else {
    award("quiz");
    Metrics.track("questionnaire_completed", { questions: seq.length, priorities: ans("prioridades")||[], incomodo: ans("incomodo")?.choice || null });
    go("crossing");
  }
}

/* --- Avaliação --- */
function bindRating(){
  const stars = $$(".star"); if (!stars.length) return;
  const light = n => stars.forEach((s,i)=> s.classList.toggle("lit", i < n));
  stars.forEach((s,i)=>{ s.addEventListener("mouseenter", ()=>light(i+1)); s.addEventListener("focus", ()=>light(i+1)); });
  $(".stars").addEventListener("mouseleave", ()=>light(S.rating||0));
  $("#rateComment")?.addEventListener("input", e => { S.ratingComment = e.target.value.slice(0,500); });
}

/* --- Modais --- */
function modal(html){
  $("#modalRoot").innerHTML = `<div class="modal-back" data-action="modal-close-bg"><div class="modal" role="dialog" aria-modal="true">${`<button class="icon-btn close" data-action="modal-close" aria-label="Fechar">${icon("close")}</button>`}${html}</div></div>`;
  $(".modal button, .modal a")?.focus();
}
const closeModal = () => { $("#modalRoot").innerHTML = ""; };
function showHow(){
  const D = S.diagnosis; if (!D) return;
  const groups = DIMS.map(d => {
    const items = D.scores.contrib.filter(c=>c.dim===d.key);
    return `<h4 style="margin-top:18px">${d.name} · peso ${Math.round(d.weight*100)}% → <b>${D.scores.dims[d.key]}%</b></h4><div class="contrib">${items.map(c=>`<div><span>${esc(c.label)}</span><span class="${c.base?"":c.value>=0?"pos":"neg"}">${c.base?c.value:(c.value>0?"+":"")+c.value}</span></div>`).join("")}</div>`;
  }).join("");
  modal(`<span class="eyebrow">Transparência</span><h3>Como calculamos sua conexão</h3>
    <p>O índice não é sorteado nem escolhido pela IA. Ele é a soma ponderada de quatro dimensões: <b>35% Funcionalidade e rotina</b>, <b>30% Identidade estética</b>, <b>20% Conforto e atmosfera</b> e <b>15% Atendimento às prioridades</b>.</p>
    <p style="margin-top:8px">Cada dimensão parte de uma base definida pela sua reação à leitura do ambiente e recebe ajustes explícitos das suas respostas e da comparação entre suas preferências e as medidas visuais da foto (luz, temperatura de cor, saturação e densidade). A foto nunca é usada para avaliar a sua personalidade. Os valores ficam entre 8% e 97%.</p>
    ${groups}<p style="margin-top:16px;font-size:.85rem">É uma estimativa de compatibilidade entre o espaço e as necessidades que você declarou — não uma avaliação técnica do imóvel.</p>`);
}
function showReview(){
  const seq = buildSequence(), fu = FOLLOWUPS[S.reaction];
  const fuLabels = (S.followup[S.reaction]||[]).map(id => fu.opts.find(o=>o.id===id)?.label).join(", ");
  modal(`<span class="eyebrow">Suas respostas</span><h3>Revisar respostas</h3><p>Ao editar uma resposta, você refaz o caminho a partir dela e o diagnóstico é recalculado.</p>
    <div class="qa">
      <div><small>Ambiente</small><b>${env().name}</b><button data-action="edit-env">Editar</button></div>
      <div><small>Sua reação à leitura</small><b>${REACTIONS[S.reaction].title}${fuLabels?` — ${esc(fuLabels)}`:""}</b><button data-action="edit-reaction">Editar</button></div>
      ${seq.map((q,i)=>`<div><small>${BLOCKS[q.block].name} · ${esc(q.short)}</small><b>${esc(answerLabel(q))}</b><button data-action="edit-q" data-id="${i}">Editar</button></div>`).join("")}
    </div>`);
}
function showPrivacy(){
  modal(`<span class="eyebrow">Privacidade e LGPD</span><h3>Como tratamos seus dados</h3>
    <ul>
      <li><b>Fotografia:</b> usada apenas para a análise que você solicitou. ${AIService.mode==="live" ? "Ela é redimensionada e enviada ao serviço de IA somente após sua autorização, sem armazenamento permanente." : "Neste modo de demonstração ela não sai do seu dispositivo."} Fotos nunca entram nas métricas.</li>
      <li><b>Respostas:</b> ficam na memória do navegador durante a jornada e somem ao reiniciar ou fechar a página. O texto livre do questionário nunca é enviado às métricas.</li>
      <li><b>Métricas anônimas (opcional):</b> com sua permissão, registramos eventos como “iniciou a jornada” ou “chegou ao relatório”, o ambiente escolhido, a pontuação, as prioridades marcadas e a avaliação por estrelas, com um identificador aleatório — sem nome, e-mail, telefone ou localização.</li>
      <li><b>Comentário da avaliação:</b> opcional; armazenado de forma anônima apenas se você escrever e enviar.</li>
      <li><b>Seus direitos:</b> você pode recusar ou revogar as métricas a qualquer momento, sem prejuízo para a experiência.</li>
    </ul>
    <div class="actions" style="margin-top:20px"><button class="btn-ghost" data-action="consent-open">${icon("shield")} Alterar preferências de métricas</button></div>`);
}
function showConsent(){
  $("#consentRoot").innerHTML = `<div class="consent" role="dialog" aria-label="Preferências de métricas">
    <p><b>Métricas anônimas.</b> Gostaríamos de registrar, de forma anônima, como a experiência é usada (etapas concluídas, ambiente, pontuação e avaliação), para melhorá-la. Nunca coletamos fotos, nomes ou contatos.</p>
    <div class="row"><button class="yes" data-action="consent-yes">Aceitar métricas</button><button data-action="consent-no">Recusar</button><button class="link" data-action="privacy">Saber mais</button></div></div>`;
}
function confirmRestart(){
  modal(`<span class="eyebrow">Reiniciar</span><h3>Começar uma nova descoberta?</h3><p>Suas respostas, sua foto e o diagnóstico desta jornada serão apagados deste navegador.</p>
    <div class="actions"><button class="btn-ghost" data-action="modal-close">Cancelar</button>${nextBtn("Reiniciar experiência","restart-confirm",false,"solo")}</div>`);
}

/* --- Delegação de ações --- */
const ACTIONS = {
  home(){ go("intro"); },
  start(){ Metrics.track("journey_started"); go("env"); },
  back(){ const p = PREV[S.screen]; if (p) go(p); },
  "select-env"(el){ const id = el.dataset.id; if (S.env && S.env !== id && S.analysis){ resetFromAnalysis(); } S.env = id; $$(".env-card").forEach(c=>c.setAttribute("aria-pressed", c.dataset.id===id)); $(".actions .hint").innerHTML = `Você escolheu: <b>${ENVS[id].name}</b>`; $('[data-action="env-next"]').disabled = false; },
  "env-next"(){ if (!S.env) return; Metrics.track("environment_selected", { environment:S.env }); go("upload"); },
  "pick-gallery"(){ $("#fileGallery").click(); },
  "pick-camera"(){ $("#fileCamera").click(); },
  "remove-photo"(){ if (S.photo?.url) URL.revokeObjectURL(S.photo.url); S.photo = null; S.features = null; resetFromAnalysis(); render(); },
  "upload-next"(){
    if (!S.photo) return;
    if (AIService.mode === "live" && !S.aiConsent) return showUploadError("Para seguir com a análise por IA, autorize o envio da foto.");
    Metrics.track("photo_uploaded"); award("photo");
    if (S.analysis){ go("reading"); return; }
    go("analyzing");
  },
  "retry-analysis"(){ render(); },
  "demo-analysis"(){ S.analysis = demoInterpretation(S.features, S.env); S.analysisSource = "demo"; S.traits = { ...S.features.traits }; Metrics.track("ai_analysis_completed", { source:"demo-fallback" }); go("reading"); },
  "back-upload"(){ go("upload"); },
  "reading-next"(){ award("reading"); go("reaction"); },
  react(el){
    const id = el.dataset.id; if (S.reaction !== id){ S.reaction = id; S.dirty = true; }
    render(); setTimeout(()=> $("#followup")?.scrollIntoView({ behavior:"smooth", block:"center" }), 120);
  },
  followup(el){
    const id = el.dataset.id, fu = FOLLOWUPS[S.reaction], o = fu.opts.find(x=>x.id===id);
    let arr = [...S.followup[S.reaction]]; S.dirty = true;
    if (arr.includes(id)) arr = arr.filter(x=>x!==id);
    else if (o.exclusive) arr = [id];
    else { arr = arr.filter(x => !fu.opts.find(y=>y.id===x)?.exclusive); if (arr.length >= fu.max){ $("#fuNote").textContent = `Escolha até ${fu.max}.`; $("#fuNote").classList.add("warn"); return; } arr.push(id); }
    S.followup[S.reaction] = arr;
    $$('[data-action="followup"]').forEach(b => b.setAttribute("aria-pressed", arr.includes(b.dataset.id)));
    $("#fuNote").textContent = ""; $('[data-action="reaction-next"]').disabled = !arr.length;
    $(".actions .hint").textContent = arr.length ? "Agora vamos conhecer você." : "Selecione pelo menos uma opção acima";
  },
  "reaction-next"(){ if (!S.reaction || !S.followup[S.reaction].length) return; Metrics.track("interpretation_reacted", { reaction:S.reaction }); go("quiz"); },
  answer(el){ answerQuestion(el.dataset.id); },
  "quiz-next"(){ quizNext(); },
  "quiz-back"(){ if (S.qIndex > 0){ S.qIndex--; go("quiz"); } else go("reaction"); },
  "result-next"(){ go("book"); },
  "result-back"(){ S.qIndex = buildSequence().length-1; go("quiz"); },
  "book-next"(){ go("report"); },
  how(){ showHow(); },
  review(){ showReview(); },
  "see-result"(){ go("result"); },
  print(){ window.print(); },
  "edit-env"(){ closeModal(); go("env"); },
  "edit-reaction"(){ closeModal(); go("reaction"); },
  "edit-q"(el){ closeModal(); S.qIndex = Number(el.dataset.id); go("quiz"); },
  star(el){
    const n = Number(el.dataset.id); S.rating = n;
    $$(".star").forEach((s,i)=>{ s.classList.toggle("lit", i<n); s.setAttribute("aria-checked", i===n-1); });
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    $("#rateMsg").textContent = RATE_MSG[n]; $('[data-action="rate-send"]').disabled = false;
  },
  "rate-send"(){
    if (!S.rating) return;
    const comment = ($("#rateComment")?.value || "").trim().slice(0,500);
    Metrics.track("experience_rated", { rating:S.rating, has_comment: !!comment });
    Metrics.feedback(S.rating, comment);
    S.ratingSent = true; $("#rate").innerHTML = rateInner();
  },
  instagram(){ Metrics.track("instagram_clicked", {}, { repeat:false }); return true; /* segue o link */ },
  restart(){ confirmRestart(); },
  "restart-confirm"(){ closeModal(); if (S.photo?.url) URL.revokeObjectURL(S.photo.url); S = freshState(); Metrics.newJourney(); go("intro"); },
  privacy(){ showPrivacy(); },
  "consent-open"(){ closeModal(); showConsent(); },
  "consent-yes"(){ const first = Metrics.consent !== "granted"; Metrics.consent = "granted"; $("#consentRoot").innerHTML = ""; if (first){ Metrics.track("page_view"); if (S.screen !== "intro") Metrics.track("journey_started"); } },
  "consent-no"(){ Metrics.consent = "denied"; store.del("sctr_vid"); $("#consentRoot").innerHTML = ""; },
  "modal-close"(){ closeModal(); },
  "modal-close-bg"(el, e){ if (e.target === el) closeModal(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  if (el.tagName === "A" && el.dataset.action === "instagram"){ fn(el, e); return; } // não bloquear o link
  e.preventDefault(); fn(el, e);
});
document.addEventListener("change", e => {
  if (e.target.id === "aiConsent"){ S.aiConsent = e.target.checked; const b = $('[data-action="upload-next"]'); if (b) b.disabled = !S.photo || !S.aiConsent; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalRoot").innerHTML) closeModal(); });
window.addEventListener("scroll", () => $("#topbar").classList.toggle("scrolled", window.scrollY > 8), { passive:true });

/* Abandono: registrado ao sair da página com a jornada iniciada e não concluída */
window.addEventListener("pagehide", () => {
  if (Metrics.sent.has("journey_started") && !Metrics.sent.has("report_viewed")) Metrics.track("journey_abandoned", { last_step:S.screen, question:S.screen==="quiz"?S.qIndex+1:null }, { beacon:true });
});

/* Inicialização */
(function init(){
  history.replaceState({ screen:"intro" }, "", location.pathname + location.search);
  S.screen = "intro"; render();
  AIService.detect().then(on => { if (!on) return; updateHeader(); if (S.screen === "upload" || S.screen === "env") render(); });
  if (Metrics.consent === null) setTimeout(showConsent, 900);
  else if (Metrics.consent === "granted") Metrics.track("page_view");
})();
</script>
